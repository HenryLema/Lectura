<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>RedOtavalo — Menú</title>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --cyan:#00bcd4;
      --cyan-dark:#0097a7;
      --cyan-light:#e0f7fa;
      --cyan-glow:rgba(0,188,212,0.18);
      --green:#008000;
      --red:#e53935;
      --amber:#f57c00;
      --blue:#1565c0;
      --purple:#6a1b9a;
      --teal:#00695c;
      --bg:#f0fbfc;
      --card:#ffffff;
      --text:#01303a;
      --muted:#4a7a84;
      --border:rgba(0,188,212,0.25);
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    html,body{
      height:100%;
      background:var(--bg);
      font-family:'Exo 2',sans-serif;
      color:var(--text);
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,188,212,0.12) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,188,212,0.04) 39px, rgba(0,188,212,0.04) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,188,212,0.04) 39px, rgba(0,188,212,0.04) 40px);
      pointer-events:none;
      z-index:0;
    }

    .page{
      position:relative;z-index:1;
      min-height:100vh;
      display:flex;flex-direction:column;
      align-items:center;
      padding:0 16px 32px;
    }

    .header{
      width:100%;max-width:480px;
      padding:28px 0 20px;
      text-align:center;
    }
    .header-icon{
      font-size:38px;
      line-height:1;
      margin-bottom:8px;
      display:block;
      animation:float 3s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-5px)}
    }
    .header-title{
      font-size:22px;font-weight:700;
      color:var(--cyan-dark);
      letter-spacing:0.5px;
      line-height:1.15;
    }
    .header-sub{
      font-size:12px;font-weight:400;
      color:var(--muted);
      font-family:'Rajdhani',sans-serif;
      letter-spacing:1.5px;
      text-transform:uppercase;
      margin-top:4px;
    }
    .header-line{
      width:48px;height:3px;
      background:var(--cyan);
      border-radius:2px;
      margin:12px auto 0;
    }

    /* Contador de actualización */
    .refresh-bar{
      width:100%;max-width:480px;
      display:flex;align-items:center;gap:8px;
      margin-bottom:10px;
      padding:6px 10px;
      background:rgba(0,188,212,0.07);
      border:1px solid rgba(0,188,212,0.18);
      border-radius:10px;
      font-family:'Rajdhani',sans-serif;
      font-size:11px;
      color:var(--muted);
      letter-spacing:0.5px;
    }
    .refresh-dot{
      width:7px;height:7px;
      border-radius:50%;
      background:var(--cyan);
      flex-shrink:0;
    }
    .refresh-progress{
      flex:1;
      height:3px;
      background:rgba(0,188,212,0.15);
      border-radius:2px;
      overflow:hidden;
    }
    .refresh-fill{
      height:100%;
      background:var(--cyan);
      border-radius:2px;
      transition:width 1s linear;
    }

    .btn-grid{
      width:100%;max-width:480px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:4px;
    }

    .btn-full{grid-column:1/-1}

    .btn-card{
      background:var(--card);
      border:1.5px solid var(--border);
      border-radius:16px;
      padding:18px 14px 16px;
      display:flex;flex-direction:column;
      align-items:center;gap:8px;
      cursor:pointer;
      text-decoration:none;
      color:inherit;
      transition:transform .15s, box-shadow .15s, border-color .15s, background .15s;
      position:relative;
      overflow:hidden;
      -webkit-user-select:none;user-select:none;
    }
    .btn-card::before{
      content:'';
      position:absolute;inset:0;
      opacity:0;
      transition:opacity .2s;
      border-radius:inherit;
    }
    .btn-card:active{
      transform:scale(0.96);
    }
    .btn-card:hover{
      border-color:var(--btn-color, var(--cyan));
      box-shadow:0 4px 20px var(--btn-shadow, var(--cyan-glow));
      background:var(--btn-bg, var(--cyan-light));
    }
    .btn-card:hover::before{opacity:1}

    .btn-mapa{
      --btn-color:#00bcd4;
      --btn-shadow:rgba(0,188,212,0.2);
      --btn-bg:#e0f7fa;
      grid-column:1/-1;
    }
    .btn-salida{
      --btn-color:#008000;
      --btn-shadow:rgba(0,128,0,0.18);
      --btn-bg:#e8f5e9;
    }
    .btn-retorno{
      --btn-color:#e53935;
      --btn-shadow:rgba(229,57,53,0.18);
      --btn-bg:#ffebee;
    }
    .btn-info{
      --btn-color:#1565c0;
      --btn-shadow:rgba(21,101,192,0.18);
      --btn-bg:#e3f2fd;
    }
    .btn-actualizar{
      --btn-color:#f57c00;
      --btn-shadow:rgba(245,124,0,0.18);
      --btn-bg:#fff3e0;
    }
    .btn-contacto{
      --btn-color:#6a1b9a;
      --btn-shadow:rgba(106,27,154,0.18);
      --btn-bg:#f3e5f5;
    }

    .btn-emoji{
      font-size:32px;
      line-height:1;
      display:block;
    }
    .btn-mapa .btn-emoji{font-size:36px}

    .btn-bar{
      position:absolute;top:0;left:0;right:0;
      height:3px;
      background:var(--btn-color, var(--cyan));
      border-radius:16px 16px 0 0;
      opacity:0.6;
    }

    .btn-label{
      font-size:13px;font-weight:600;
      color:var(--text);
      text-align:center;
      line-height:1.2;
      font-family:'Exo 2',sans-serif;
    }
    .btn-mapa .btn-label{font-size:15px}

    .btn-desc{
      font-size:10px;
      color:var(--muted);
      text-align:center;
      font-family:'Rajdhani',sans-serif;
      letter-spacing:0.5px;
      line-height:1.3;
    }

    .live-badge{
      display:inline-flex;align-items:center;gap:4px;
      background:rgba(0,188,212,0.12);
      border:1px solid rgba(0,188,212,0.3);
      border-radius:20px;
      padding:2px 8px;
      font-size:10px;color:var(--cyan-dark);
      font-family:'Rajdhani',sans-serif;
      font-weight:600;letter-spacing:0.5px;
    }
    .live-dot{
      width:6px;height:6px;
      border-radius:50%;
      background:var(--cyan);
      animation:pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.5;transform:scale(0.7)}
    }

    .btn-arrow{
      position:absolute;bottom:10px;right:12px;
      font-size:14px;
      color:var(--btn-color, var(--cyan));
      opacity:0.4;
      transition:opacity .2s, transform .2s;
    }
    .btn-card:hover .btn-arrow{opacity:0.8;transform:translateX(2px)}

    .footer{
      margin-top:24px;
      text-align:center;
      font-size:10px;
      color:var(--muted);
      font-family:'Rajdhani',sans-serif;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .btn-card{
      opacity:0;
      transform:translateY(16px);
      animation:fadeUp .4s ease forwards;
    }
    .btn-card:nth-child(1){animation-delay:.05s}
    .btn-card:nth-child(2){animation-delay:.12s}
    .btn-card:nth-child(3){animation-delay:.19s}
    .btn-card:nth-child(4){animation-delay:.26s}
    .btn-card:nth-child(5){animation-delay:.33s}
    .btn-card:nth-child(6){animation-delay:.40s}
    @keyframes fadeUp{
      to{opacity:1;transform:translateY(0)}
    }
  </style>
</head>
<body>
<div class="page">

  <header class="header">
    <span class="header-icon">🚍</span>
    <div class="header-title">Red Otavalo Telecomunicaciones</div>
    <div class="header-sub">Terminal · Centro · Quichinche</div>
    <div class="header-line"></div>
  </header>

  <!-- Barra de auto-actualización -->
  <div class="refresh-bar">
    <span class="refresh-dot"></span>
    <span id="refresh-text">Actualizando en 10s</span>
    <div class="refresh-progress">
      <div class="refresh-fill" id="refresh-fill" style="width:100%"></div>
    </div>
  </div>

  <div class="btn-grid">

    <a class="btn-card btn-mapa" href="https://henrylema.github.io/Lectura/index.html" target="_blank" onclick="sonar('mapa')">
      <div class="btn-bar"></div>
      <span class="btn-emoji">🗺️</span>
      <span class="btn-label">Terminal Terrestre de Otavalo</span>
      <span class="live-badge"><span class="live-dot"></span>En Tiempo Real</span>
      <span class="btn-desc">Rutas · Paradas · Tiempo Estimado de Llegada</span>
      <span class="btn-arrow">›</span>
    </a>

    <button class="btn-card btn-salida" onclick="sonar('salida'); abrirSeccion('salida')">
      <div class="btn-bar"></div>
      <span class="btn-emoji">🗑️</span>
      <span class="btn-label">Recolector de Basura</span>
      <span class="btn-desc">Proximamente</span>
      <span class="btn-arrow">›</span>
    </button>

    <button class="btn-card btn-retorno" onclick="sonar('retorno'); abrirSeccion('retorno')">
      <div class="btn-bar"></div>
      <span class="btn-emoji">🛒</span>
      <span class="btn-label">Trueque</span>
      <span class="btn-desc">Proximamente</span>
      <span class="btn-arrow">›</span>
    </button>

    <button class="btn-card btn-info" onclick="sonar('info'); abrirSeccion('info')">
      <div class="btn-bar"></div>
      <span class="btn-emoji">🚨</span>
      <span class="btn-label">Seguridad Comunitaria</span>
      <span class="btn-desc">Rastreo · Control</span>
      <span class="btn-arrow">›</span>
    </button>

    <button class="btn-card btn-actualizar" onclick="sonar('actualizar'); actualizarApp()">
      <div class="btn-bar"></div>
      <span class="btn-emoji">🚑</span>
      <span class="btn-label">Emergencias Médicas</span>
      <span class="btn-desc">Proximamente</span>
      <span class="btn-arrow">›</span>
    </button>

    <button class="btn-card btn-contacto" onclick="sonar('contacto'); abrirSeccion('contacto')">
      <div class="btn-bar"></div>
      <span class="btn-emoji">📞</span>
      <span class="btn-label">Contacto</span>
      <span class="btn-desc">Información de la ruta</span>
      <span class="btn-arrow">›</span>
    </button>

  </div>

  <div class="footer">Otavalo · Ecuador 🇪🇨</div>

</div>

<script>
  const MAPA_URL = "https://henrylema.github.io/Lectura/index.html";

  // ── SISTEMA DE SONIDO con Web Audio API (sin archivos externos) ──
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Configuración de sonido por tipo de botón
  const sonidos = {
    mapa:      { freq: 880, freq2: 1100, tipo: 'sine',    duracion: 0.18, vol: 0.25 },
    salida:    { freq: 660, freq2: 440,  tipo: 'sine',    duracion: 0.15, vol: 0.22 },
    retorno:   { freq: 440, freq2: 330,  tipo: 'sine',    duracion: 0.15, vol: 0.22 },
    info:      { freq: 520, freq2: 780,  tipo: 'sine',    duracion: 0.18, vol: 0.22 },
    actualizar:{ freq: 600, freq2: 900,  tipo: 'sine',    duracion: 0.20, vol: 0.22 },
    contacto:  { freq: 700, freq2: 1050, tipo: 'sine',    duracion: 0.18, vol: 0.22 },
  };

  function sonar(tipo) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const cfg = sonidos[tipo] || sonidos.info;
      const dur = cfg.duracion;

      // Oscilador 1
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = cfg.tipo;
      osc1.frequency.setValueAtTime(cfg.freq, audioCtx.currentTime);
      osc1.frequency.exponentialRampToValueAtTime(cfg.freq2, audioCtx.currentTime + dur);
      gain1.gain.setValueAtTime(cfg.vol, audioCtx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(audioCtx.currentTime);
      osc1.stop(audioCtx.currentTime + dur);

      // Oscilador 2 (armónico suave para riqueza)
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(cfg.freq * 1.5, audioCtx.currentTime);
      gain2.gain.setValueAtTime(cfg.vol * 0.4, audioCtx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur * 0.8);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(audioCtx.currentTime);
      osc2.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }

  // ── AUTO-ACTUALIZACIÓN CADA 10 SEGUNDOS ──
  const INTERVALO = 10;
  let segundosRestantes = INTERVALO;

  const fillEl  = document.getElementById('refresh-fill');
  const textEl  = document.getElementById('refresh-text');

  function actualizarContador() {
    segundosRestantes--;
    const pct = (segundosRestantes / INTERVALO) * 100;
    fillEl.style.width = pct + '%';
    textEl.textContent = segundosRestantes > 0
      ? 'Actualizando en ' + segundosRestantes + 's'
      : 'Actualizando…';

    if (segundosRestantes <= 0) {
      location.reload();
    }
  }

  setInterval(actualizarContador, 1000);

  // ── FUNCIONES ORIGINALES ──
  function actualizarApp() {
    const btn = document.querySelector('.btn-actualizar');
    btn.style.transform = 'scale(0.94)';
    setTimeout(() => { btn.style.transform = ''; location.reload(); }, 200);
  }

  function abrirSeccion(seccion) {
    const urls = {
      salida:   MAPA_URL + "#salida",
      retorno:  MAPA_URL + "#retorno",
      info:     MAPA_URL + "#info",
      contacto: "tel:+593963761330"
    };
    if (urls[seccion]) {
      window.location.href = urls[seccion];
    }
  }
</script>
</body>
</html>
