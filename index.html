<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tracking GPS en Tiempo Real</title>

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      font-size: 13px;
    }

    #top { padding: 6px 10px; }

    h3 { margin: 0; font-size: 15px; }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .box {
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
    }

    #map { height: calc(100vh - 60px); }

    /* 🚍 icono bus */
    .bus-icon {
      font-size: 24px;
      line-height: 24px;
      text-shadow: 0 0 2px rgba(0,0,0,0.35);
      transform: translate(-50%, -50%);
    }

    /* 🚏 icono parada */
    .stop-icon {
      font-size: 42px;
      line-height: 42px;
      text-shadow: 0 0 2px rgba(0,0,0,0.35);
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <div id="top">
    <h3>🚍 GPS en Tiempo Real</h3>
    <div class="row">
      <div class="box">Hora: <b id="hora">--</b></div>
      <div class="box">Lat: <b id="lat">--</b></div>
      <div class="box">Lon: <b id="lon">--</b></div>
      <div class="box">Sats: <b id="sats">--</b></div>
      <div class="box">Fix: <b id="fix">--</b></div>

      <!-- ✅ NUEVO: ETA -->
      <div class="box">ETA a parada: <b id="eta">--</b></div>
      <div class="box">Distancia: <b id="distStop">--</b></div>
      <div class="box">Velocidad: <b id="speed">--</b></div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Firebase Web SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1PlndJO4Ntcx-1kBF0_9civhqmw6RW6o",
      authDomain: "gpsdb-f5976.firebaseapp.com",
      databaseURL: "https://gpsdb-f5976-default-rtdb.firebaseio.com",
      projectId: "gpsdb-f5976",
      storageBucket: "gpsdb-f5976.firebasestorage.app",
      messagingSenderId: "649332381832",
      appId: "1:649332381832:web:3854b0d15d3d9230dde73d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ---------------- MAPA ----------------
    const map = L.map('map', { zoomControl: true }).setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    // 🚍 Icono bus
    const busIcon = L.divIcon({
      className: "bus-icon",
      html: "🚍",
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    // 🚏 Icono parada
    const stopIcon = L.divIcon({
      className: "stop-icon",
      html: "🚏",
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    // Marcador del bus (dinámico)
    let marker = L.marker([0, 0], { icon: busIcon }).addTo(map);

    // 🔹 Marcador FIJO de parada de bus
    const stopLat = 0.23081921936948996;
    const stopLon = -78.25795579701662;

    L.marker([stopLat, stopLon], { icon: stopIcon })
      .addTo(map)
      .bindPopup("🚏 Parada de bus");

    // ---------------- RECORRIDO (línea verde) ----------------
    const trailLatLngs = [];
    const trailLine = L.polyline(trailLatLngs, {
      color: "green",
      weight: 6,
      opacity: 0.95
    }).addTo(map);

    // Parpadeo de la línea
    let blinkOn = true;
    setInterval(() => {
      blinkOn = !blinkOn;
      trailLine.setStyle({ opacity: blinkOn ? 0.95 : 0.25 });
    }, 800);

    const MAX_POINTS = 1500;

    // ---------------- SUAVIZADO (EMA) ----------------
    const ALPHA = 0.65;
    let smoothLat = null;
    let smoothLon = null;

    function ema(prev, x, alpha) {
      return prev === null ? x : (alpha * x + (1 - alpha) * prev);
    }

    const MAX_JUMP_METERS = 300;

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = v => v * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon/2)**2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // ---------------- ✅ ETA (tiempo estimado) ----------------
    // Guardamos el último punto suavizado y el tiempo para estimar velocidad real
    let prevPoint = null;          // [lat, lon]
    let prevTimeMs = null;

    // Velocidad suavizada para que no salte (EMA)
    let speedKmhSmoothed = null;
    const SPEED_ALPHA = 0.5; // más alto => responde más rápido

    function formatETA(seconds) {
      if (!isFinite(seconds) || seconds <= 0) return "--";
      const mins = Math.round(seconds / 60);
      if (mins < 1) return "< 1 min";
      if (mins < 60) return `${mins} min`;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${h} h ${m} min`;
    }

    // ---------------- FIREBASE LISTENER ----------------
    const gpsRef = ref(db, "gps");

    onValue(gpsRef, (snap) => {
      const d = snap.val();
      if (!d) return;

      const lat = Number(d.lat || 0);
      const lon = Number(d.lon || 0);

      document.getElementById("hora").textContent = d.hora_ecuador ?? "--";
      document.getElementById("lat").textContent  = lat.toFixed(6);
      document.getElementById("lon").textContent  = lon.toFixed(6);
      document.getElementById("sats").textContent = d.satelites ?? "--";
      document.getElementById("fix").textContent  = d.fix ? "✅" : "❌";

      if (!lat || !lon || d.fix === false) return;

      if (smoothLat !== null && smoothLon !== null) {
        const jump = haversineMeters(smoothLat, smoothLon, lat, lon);
        if (jump > MAX_JUMP_METERS) return;
      }

      // Suavizado posición
      smoothLat = ema(smoothLat, lat, ALPHA);
      smoothLon = ema(smoothLon, lon, ALPHA);

      const smoothPoint = [smoothLat, smoothLon];

      // ✅ Calcular velocidad basada en el desplazamiento entre puntos suavizados
      const nowMs = Date.now();
      if (prevPoint && prevTimeMs) {
        const dtS = (nowMs - prevTimeMs) / 1000.0;
        if (dtS > 0.2) {
          const distM = haversineMeters(prevPoint[0], prevPoint[1], smoothPoint[0], smoothPoint[1]);
          const speedKmh = (distM / dtS) * 3.6;

          // Suavizar velocidad para evitar saltos
          speedKmhSmoothed = ema(speedKmhSmoothed, speedKmh, SPEED_ALPHA);
        }
      }
      prevPoint = smoothPoint;
      prevTimeMs = nowMs;

      // ✅ Distancia a la parada
      const distToStopM = haversineMeters(smoothPoint[0], smoothPoint[1], stopLat, stopLon);

      // Mostrar distancia y velocidad
      document.getElementById("distStop").textContent = `${distToStopM.toFixed(0)} m`;
      const shownSpeed = (speedKmhSmoothed ?? 0);
      document.getElementById("speed").textContent = shownSpeed > 0.1 ? `${shownSpeed.toFixed(1)} km/h` : "0.0 km/h";

      // ✅ ETA aproximado
      // Si velocidad es muy baja, no calculamos (evita infinito)
      const MIN_SPEED_FOR_ETA = 3.0; // km/h mínimo para calcular ETA
      if (speedKmhSmoothed !== null && speedKmhSmoothed >= MIN_SPEED_FOR_ETA) {
        const speedMs = (speedKmhSmoothed / 3.6);
        const etaSec = distToStopM / speedMs;
        document.getElementById("eta").textContent = formatETA(etaSec);
      } else {
        document.getElementById("eta").textContent = "Calculando...";
      }

      // Actualiza bus
      marker.setLatLng(smoothPoint);

      // Recorrido
      trailLatLngs.push(smoothPoint);
      if (trailLatLngs.length > MAX_POINTS) trailLatLngs.shift();
      trailLine.setLatLngs(trailLatLngs);

      // Cámara
      map.panTo(smoothPoint, { animate: true, duration: 0.4 });
      if (trailLatLngs.length === 1) map.setView(smoothPoint, 16);
    });
  </script>

</body>
</html>
