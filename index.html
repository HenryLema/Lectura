<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracking GPS en Tiempo Real</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* ===== BASE ===== */
body{margin:0;font:12px Arial,sans-serif}
html,body,#map{height:100%;width:100%}
#map{position:fixed;inset:0}

/* ===== TOP ===== */
#top{position:fixed;top:0;left:0;right:0;z-index:1000;padding:5px 8px;pointer-events:none}
#top *{pointer-events:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px}

.box,.title-box{
  padding:3px 6px;
  border:1px solid rgba(221,221,221,.85);
  border-radius:8px;
  background:rgba(255,255,255,.55);
  font-size:11px;
}
.title-box{line-height:1.15}

/* ===== BOTONES ===== */
.btn-refresh{
  padding:3px 6px;
  border:1px solid #bbb;
  background:rgba(255,255,255,.85);
  border-radius:8px;
  font-size:11px;
  cursor:pointer;
}
.btn-refresh:active{transform:scale(.98)}

/* ===== BUS ===== */
.bus-wrap{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.9);
}
.bus-wrap.moving{background:#008000}
.bus-wrap.stopped{background:#ff0000}
.bus-emoji{font-size:18px}
.stop-icon{font-size:30px;transform:translate(-50%,-50%)}

/* ===== ESTADO ===== */
.busstate-pill{
  padding:3px 6px;border-radius:8px;
  color:#fff;font-size:11px
}
.busstate-pill.moving{background:#008000}
.busstate-pill.stopped{background:#ff0000}

/* ===== LEAFLET SIN SOMBRAS ===== */
.leaflet-popup-content-wrapper,
.leaflet-popup-tip,
.leaflet-marker-shadow{
  box-shadow:none!important;
}
.leaflet-popup-content{margin:6px;font-weight:normal}

/* ===== POPUPS ===== */
.popup-wrap,.stop-popup-wrap{font:12px Arial}
.popup-title,.stop-popup-title{text-align:center;margin-bottom:4px}
.popup-line,.stop-popup-line{margin:3px 0}
.popup-val.moving{color:#008000}
.popup-val.stopped{color:#ff0000}

/* ===== MODAL INFO ===== */
#infoOverlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.25);
  display:none;
  align-items:center;justify-content:center;
  z-index:2000;
}
#infoModal{
  width:min(760px,calc(100vw - 24px));
  background:#fff;
  border:1px solid rgba(221,221,221,.95);
  border-radius:14px;
  padding:10px 12px;
  font:12px Arial;
}
#infoTopRow{display:flex;justify-content:space-between;align-items:center}
#infoClose{
  padding:3px 8px;
  border:1px solid #bbb;
  background:#fff;
  border-radius:8px;
  font-size:11px;
  cursor:pointer;
}
#infoGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){#infoGrid{grid-template-columns:1fr}}
.infoCol{border:1px solid rgba(221,221,221,.85);border-radius:12px;padding:10px}
.infoColTitle{text-align:center;margin-bottom:6px}
.infoLine{margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

<body>

<div id="top">
  <div class="title-box">🚍 TerminalOtavalo-Centro-SanJuanAlto-LaBanda-Quichinche</div>
  <div class="row">
    <div class="box">Hora: <span id="hora">--</span></div>
    <div class="box">Estado: <span id="busState" class="busstate-pill stopped">Detenido</span></div>
    <button id="btnReload" class="btn-refresh">🔃 Recargar</button>
    <button id="btnToggleTrail" class="btn-refresh">🟢 Ruta: Si</button>
    <button id="btnInfo" class="btn-refresh">ℹ️ Info</button>
  </div>
</div>

<div id="map"></div>

<div id="infoOverlay">
  <div id="infoModal">
    <div id="infoTopRow">
      <div>Información en Tiempo Real (Firebase)</div>
      <button id="infoClose">Cerrar</button>
    </div>
    <div id="infoGrid">
      <div class="infoCol">
        <div class="infoColTitle">NodoMovil</div>
        <div id="infoMovil"></div>
      </div>
      <div class="infoCol">
        <div class="infoColTitle">NodoFijo</div>
        <div id="infoFijo"></div>
      </div>
    </div>
  </div>
</div>

<!-- 🔴 SCRIPT ORIGINAL SIN CAMBIOS -->
<script type="module">
/* TODO TU JAVASCRIPT VA AQUÍ EXACTAMENTE IGUAL */
/* NO TOQUÉ NI UNA SOLA LÍNEA DE TU JS */
</script>

</body>
</html>
