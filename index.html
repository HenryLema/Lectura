<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tracking GPS en Tiempo Real</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; font-size: 13px; }
    #top { padding: 6px 10px; }
    h3 { margin: 0; font-size: 15px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
    .box { padding: 4px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
    #map { height: calc(100vh - 60px); }

    .bus-icon { font-size: 24px; transform: translate(-50%, -50%); }

    /* ✅ Paradas SIN color (solo ícono) */
    .stop-icon {
      font-size: 42px;
      transform: translate(-50%, -50%);
    }

    /* ✅ Botón pequeño */
    .btn-refresh{
      padding: 4px 8px;
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .btn-refresh:active{ transform: scale(0.98); }
  </style>
</head>

<body>
  <div id="top">
    <h3>🚍 GPS en Tiempo Real</h3>
    <div class="row">
      <div class="box">Hora: <b id="hora">--</b></div>
      <div class="box">Lat: <b id="lat">--</b></div>
      <div class="box">Lon: <b id="lon">--</b></div>
      <div class="box">Velocidad: <b id="speed">--</b></div>

      <!-- ✅ Botón pequeño para actualizar el mapa -->
      <button id="btnRefresh" class="btn-refresh">🔄 Actualizar mapa</button>

      //<div class="box">ETA Nodo Fijo: <b id="eta_nf">--</b></div>
     // <div class="box">Dist Nodo Fijo: <b id="dist_nf">--</b></div>
    </div>
  </div>

  <div id="map"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1PlndJO4Ntcx-1kBF0_9civhqmw6RW6o",
  authDomain: "gpsdb-f5976.firebaseapp.com",
  databaseURL: "https://gpsdb-f5976-default-rtdb.firebaseio.com",
  projectId: "gpsdb-f5976"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------------- MAPA ----------------
const map = L.map('map').setView([0,0], 2);
const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
tiles.addTo(map);

const busIcon  = L.divIcon({ className:'bus-icon',  html:'🚍', iconSize:[24,24], iconAnchor:[12,12] });
const stopIcon = L.divIcon({ className:'stop-icon', html:'🚏', iconSize:[42,42], iconAnchor:[21,21] });

const busMarker = L.marker([0,0], {icon:busIcon}).addTo(map);

// ---------------- ✅ AUTO-FOLLOW CON PAUSA 10s POR ZOOM/MOVER ----------------
const FOLLOW_RESUME_MS = 10000; // 10 segundos
let followEnabled = true;
let followTimer = null;

function pauseFollowFor(ms = FOLLOW_RESUME_MS) {
  followEnabled = false;
  if (followTimer) clearTimeout(followTimer);
  followTimer = setTimeout(() => {
    followEnabled = true;
    if (lastLatLng) {
      map.setView(lastLatLng, map.getZoom(), { animate: true, duration: 0.6 });
    }
  }, ms);
}

// Detecta zoom (rueda/pinch/botones)
map.on("zoomstart", () => pauseFollowFor());
map.on("zoom", () => pauseFollowFor());

// Detecta mover mapa (drag)
map.on("dragstart", () => pauseFollowFor());
map.on("movestart", () => pauseFollowFor());

// ---------------- ✅ BOTÓN: ACTUALIZAR MAPA ----------------
document.getElementById("btnRefresh").addEventListener("click", () => {
  // Recalcula tamaño (muy útil si se quedó “en blanco” por CSS/resize)
  map.invalidateSize(true);

  // Fuerza recarga de tiles
  tiles.redraw();

  // Mantén centrado en el último punto conocido (sin romper tu follow)
  if (lastLatLng) {
    map.setView(lastLatLng, map.getZoom(), { animate: true, duration: 0.4 });
  }
});

// ---------------- ✅ RECORRIDO (LÍNEA VERDE EN TIEMPO REAL) ----------------
const trailLatLngs = [];
const trailLine = L.polyline(trailLatLngs, { color: "green", weight: 6, opacity: 0.9 }).addTo(map);
const MAX_POINTS = 2500;

// ✅ Parámetros visuales de suavizado y anti-saltos (solo para la línea)
const SMOOTH_ALPHA_POS = 0.45;     // EMA posición (0.35–0.55)
const MIN_ADD_DIST_M   = 6;        // no agregues puntos casi iguales
const MAX_JUMP_DRAW_M  = 200;      // si viene un salto grande, NO lo dibujes (mantén estable)

// ✅ SNAP A CALLES (OSRM MATCH) — estable para tiempo real
const OSRM_MATCH_WINDOW = 10;      // puntos en ventana (10 pts ≈ 30s si llega cada 3s)
const OSRM_MIN_MOVE_M   = 18;      // si se mueve menos que esto, no llamamos OSRM (evita cuadrados en reposo)
const OSRM_COOLDOWN_MS  = 2500;    // no llamar OSRM más rápido que esto
const OSRM_GPS_RADIUS_M = 20;      // tolerancia del GPS para match (metros)

let lastStableDraw = null;         // [lat, lon] estable para dibujar
let lastSmoothed   = null;         // [lat, lon] suavizado

let lastLatLng = null;

// Buffer de puntos recientes para map-matching
let matchBuf = [];                 // [{lat, lon, t}]
let lastOsrmAt = 0;
let lastMatchedTail = null;        // último punto del match para continuidad

// ---------------- PARADAS (FIJAS EN LISTA) ----------------
// ✅ Eliminadas: Nodo Fijo + Paradas 12, 13, 14, 15
const stops = [
  { id:'p1',  name:'Parada 1',  lat:0.237746, lon:-78.288787 },
  { id:'p2',  name:'Parada 2',  lat:0.237163, lon:-78.289931 },
  { id:'p3',  name:'Parada 3',  lat:0.236436, lon:-78.291429 },
  { id:'p4',  name:'Parada 4',  lat:0.235681, lon:-78.292848 },
  { id:'p5',  name:'Parada 5',  lat:0.235104, lon:-78.291241 },
  { id:'p6',  name:'Parada 6',  lat:0.235786, lon:-78.290140 },
  { id:'p7',  name:'Parada 7',  lat:0.236424, lon:-78.288876 },
  { id:'p8',  name:'Parada 8',  lat:0.236883, lon:-78.287719 },
  { id:'p9',  name:'Parada 9',  lat:0.237852, lon:-78.288037 },
  { id:'p10', name:'Parada 10', lat:0.238660, lon:-78.286751 },
  { id:'p11', name:'Parada 11', lat:0.239912, lon:-78.284246 },

  { id:'p16', name:'Parada 16', lat:0.233919, lon:-78.269057 },
  { id:'p17', name:'Parada 17', lat:0.232860, lon:-78.268092 },
  { id:'p18', name:'Parada 18', lat:0.231621, lon:-78.266599 },
  { id:'p19', name:'Parada 19', lat:0.230428, lon:-78.264489 },
  { id:'p20', name:'Parada 20', lat:0.232345, lon:-78.263145 },
  { id:'p21', name:'Parada 21', lat:0.231442, lon:-78.261943 },
  { id:'p22', name:'Parada 22', lat:0.229405, lon:-78.259257 },
  { id:'p23', name:'Parada 23', lat:0.230843, lon:-78.257985 }
];

const stopMarkers = new Map();
let activeStopId = null;

// Crear markers de paradas fijas
stops.forEach(s => {
  const m = L.marker([s.lat, s.lon], {icon:stopIcon}).addTo(map);
  m.bindPopup(`<b>🚏 ${s.name}</b><br>ETA: --<br>Distancia: --`);
  m.on("popupopen", ()=>{ activeStopId = s.id; pauseFollowFor(); });
  m.on("popupclose", ()=>{ if(activeStopId===s.id) activeStopId=null; });
  stopMarkers.set(s.id, m);
});

// ---------------- UTIL ----------------
function haversineMeters(lat1, lon1, lat2, lon2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatETA(sec){
  if(!isFinite(sec)||sec<=0) return "--";
  const m=Math.round(sec/60);
  if(m<1) return "< 1 min";
  if(m<60) return `${m} min`;
  return `${Math.floor(m/60)} h ${m%60} min`;
}
function ema(prev, x, alpha){
  return (prev==null) ? x : (alpha*x + (1-alpha)*prev);
}
function ema2(prev2, x2, alpha){
  if(!prev2) return x2;
  return [ ema(prev2[0], x2[0], alpha), ema(prev2[1], x2[1], alpha) ];
}
function formatDist(m){
  if(!isFinite(m) || m<=0) return "--";
  return (m < 1000) ? `${m.toFixed(0)} m` : `${(m/1000).toFixed(2)} km`;
}

// ---------------- ✅ ETA REALISTA ----------------
const ROUTE_FACTOR = 1.45;
const ETA_BIAS_SEC = 45;
const DEFAULT_SPEED_KMH = 5;
const SPEED_ALPHA = 0.35;
const MIN_USABLE_SPEED_KMH = 3.0;
const MAX_REASONABLE_SPEED_KMH = 55;

let speedSmoothed = null;
let lastGoodSpeed = null;

function pickSpeedKmh(rawSpeedKmh){
  let s = Number(rawSpeedKmh || 0);
  if (!isFinite(s) || s < 0) s = 0;
  if (s > MAX_REASONABLE_SPEED_KMH) s = MAX_REASONABLE_SPEED_KMH;

  speedSmoothed = ema(speedSmoothed, s, SPEED_ALPHA);

  if (isFinite(speedSmoothed) && speedSmoothed >= MIN_USABLE_SPEED_KMH) {
    lastGoodSpeed = speedSmoothed;
  }

  if (isFinite(speedSmoothed) && speedSmoothed >= MIN_USABLE_SPEED_KMH) return speedSmoothed;
  if (isFinite(lastGoodSpeed) && lastGoodSpeed >= MIN_USABLE_SPEED_KMH) return lastGoodSpeed;
  return DEFAULT_SPEED_KMH;
}

function calcEtaSeconds(distStraightM, usedSpeedKmh){
  const distRoadM = distStraightM * ROUTE_FACTOR;
  const speedMs = usedSpeedKmh / 3.6;
  const etaMove = distRoadM / Math.max(speedMs, 0.1);
  return etaMove + ETA_BIAS_SEC;
}

// ---------------- ✅ RUTA VERDE (anti-locos + suavizado + SNAP A CALLES) ----------------

function pushTrail(latLng){
  trailLatLngs.push(latLng);
  if (trailLatLngs.length > MAX_POINTS) trailLatLngs.shift();
  trailLine.setLatLngs(trailLatLngs);
}

// Decodifica polilínea (OSRM match -> geometries=polyline6)
function decodePolyline6(str){
  let index=0, lat=0, lng=0, coordinates=[];
  const factor = 1e6;
  while(index < str.length){
    let b, shift=0, result=0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dlat;

    shift=0; result=0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
    lng += dlng;

    coordinates.push([lat / factor, lng / factor]);
  }
  return coordinates;
}

function chooseStablePoint(lat, lon){
  const p = [lat, lon];

  if(!lastStableDraw){
    lastStableDraw = p;
    return { point: p, usedFallback: false, jumpM: 0 };
  }

  const jumpM = haversineMeters(lastStableDraw[0], lastStableDraw[1], p[0], p[1]);

  if (jumpM > MAX_JUMP_DRAW_M) {
    return { point: lastStableDraw, usedFallback: true, jumpM };
  }

  lastStableDraw = p;
  return { point: p, usedFallback: false, jumpM };
}

function bufferMoveDistanceM(buf){
  if(buf.length < 2) return 0;
  let sum = 0;
  for(let i=1;i<buf.length;i++){
    sum += haversineMeters(buf[i-1].lat, buf[i-1].lon, buf[i].lat, buf[i].lon);
  }
  return sum;
}

// OSRM Map Matching
async function osrmMatch(buf){
  const now = Date.now();
  if (now - lastOsrmAt < OSRM_COOLDOWN_MS) return null;
  lastOsrmAt = now;

  if(buf.length < 3) return null;

  // Si casi no se movió, NO hacemos match (evita "cuadrados" en reposo)
  const movedM = bufferMoveDistanceM(buf);
  if (movedM < OSRM_MIN_MOVE_M) return null;

  const coords = buf.map(p => `${p.lon},${p.lat}`).join(";");
  const radiuses = buf.map(_ => `${OSRM_GPS_RADIUS_M}`).join(";");

  const t0 = buf[0].t;
  const times = buf.map(p => Math.max(0, Math.round((p.t - t0)/1000))).join(";");

  const url = `https://router.project-osrm.org/match/v1/driving/${coords}` +
              `?geometries=polyline6&overview=full&radiuses=${radiuses}&timestamps=${times}`;

  try{
    const r = await fetch(url, { cache:"no-store" });
    if(!r.ok) return null;
    const j = await r.json();
    if(!j || j.code !== "Ok" || !j.matchings || !j.matchings[0] || !j.matchings[0].geometry) return null;

    const line = decodePolyline6(j.matchings[0].geometry);
    if(!line || line.length < 2) return null;

    return line; // [[lat,lon],...]
  }catch(e){
    return null;
  }
}

// Actualiza la línea verde: intenta match, si no, usa suavizado directo
async function updateGreenTrail(rawLat, rawLon){
  const chosen = chooseStablePoint(rawLat, rawLon);
  const stablePoint = chosen.point;

  lastSmoothed = ema2(lastSmoothed, stablePoint, SMOOTH_ALPHA_POS);

  if(trailLatLngs.length > 0){
    const last = trailLatLngs[trailLatLngs.length - 1];
    const d = haversineMeters(last[0], last[1], lastSmoothed[0], lastSmoothed[1]);
    if (d < MIN_ADD_DIST_M) {
      matchBuf.push({ lat:lastSmoothed[0], lon:lastSmoothed[1], t: Date.now() });
      if(matchBuf.length > OSRM_MATCH_WINDOW) matchBuf.shift();
      return;
    }
  }

  if(!chosen.usedFallback){
    matchBuf.push({ lat:lastSmoothed[0], lon:lastSmoothed[1], t: Date.now() });
    if(matchBuf.length > OSRM_MATCH_WINDOW) matchBuf.shift();
  }

  let matchedLine = null;
  if(matchBuf.length >= Math.min(OSRM_MATCH_WINDOW, 6) && !chosen.usedFallback){
    matchedLine = await osrmMatch(matchBuf);
  }

  if(matchedLine && matchedLine.length >= 2){
    let startIdx = 0;
    if(lastMatchedTail){
      for(let i=0;i<matchedLine.length;i++){
        const dd = haversineMeters(lastMatchedTail[0], lastMatchedTail[1], matchedLine[i][0], matchedLine[i][1]);
        if(dd < 8){ startIdx = i+1; break; }
      }
    }

    for(let i=startIdx; i<matchedLine.length; i++){
      pushTrail(matchedLine[i]);
    }
    lastMatchedTail = matchedLine[matchedLine.length-1];
    return;
  }

  pushTrail(lastSmoothed);
}

// ---------------- FIREBASE ----------------
const gpsRef = ref(db, "NodoMovil");

// 2) Listener del GPS del bus
onValue(gpsRef, async (snap)=>{
  const d = snap.val();
  if(!d) return;

  const fix = (d.gps_fix !== undefined) ? d.gps_fix : d.fix;

  const lat = Number(d.lat || 0);
  const lon = Number(d.lon || 0);
  if(!lat || !lon) return;

  const rawSpeedKmh = Number(d.speed_kmh || 0);

  // Panel
  document.getElementById("hora").textContent = d.hora_ecuador ?? "--";
  document.getElementById("lat").textContent  = lat.toFixed(6);
  document.getElementById("lon").textContent  = lon.toFixed(6);

  const usedSpeedKmh = pickSpeedKmh(rawSpeedKmh);
  document.getElementById("speed").textContent =
    `${rawSpeedKmh.toFixed(1)} km/h (ETA usa ${usedSpeedKmh.toFixed(1)})`;

  // Bus en mapa (posición instantánea)
  const busPos=[lat,lon];
  busMarker.setLatLng(busPos);

  // ✅ Solo seguir al bus si NO hay interacción reciente (zoom/mover)
  if (followEnabled) {
    map.panTo(busPos,{animate:true,duration:0.4});
  }

  if(!lastLatLng) map.setView(busPos,16);
  lastLatLng=busPos;

  // ✅ Ruta verde centrada en calles (OSRM match) + anti-locos
  await updateGreenTrail(lat, lon);

  // Popup activo (solo paradas existentes)
  if(activeStopId){
    const s = stops.find(x=>x.id===activeStopId);
    const m = stopMarkers.get(activeStopId);
    if(!s || !m) return;

    const dist2 = haversineMeters(lat,lon,s.lat,s.lon);
    const eta2 = formatETA(calcEtaSeconds(dist2, usedSpeedKmh));
    const distText = formatDist(dist2);

    m.setPopupContent(
      `<b>🚏 ${s.name}</b>` +
      `<br>LLega: <b>${eta2}</b>` +
      `<br>Distancia: <b>${distText}</b>` +
      `<br>Velocidad Actual: <b>${usedSpeedKmh.toFixed(1)} km/h</b>` +
      `<br><small>(ruta x${ROUTE_FACTOR.toFixed(2)} + ${ETA_BIAS_SEC}s)</small>`
    );
  }
});
</script>
</body>
</html>
