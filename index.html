<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tracking GPS en Tiempo Real</title>

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      font-size: 13px;
    }

    #top {
      padding: 6px 10px;
    }

    h3 {
      margin: 0;
      font-size: 15px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .box {
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
    }

    #map {
      height: calc(100vh - 60px);
    }
  </style>
</head>

<body>

  <div id="top">
    <h3>🚍 GPS en Tiempo Real</h3>
    <div class="row">
      <div class="box">Hora: <b id="hora">--</b></div>
      <div class="box">Lat: <b id="lat">--</b></div>
      <div class="box">Lon: <b id="lon">--</b></div>
      <div class="box">Sats: <b id="sats">--</b></div>
      <div class="box">Fix: <b id="fix">--</b></div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Firebase Web SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1PlndJO4Ntcx-1kBF0_9civhqmw6RW6o",
      authDomain: "gpsdb-f5976.firebaseapp.com",
      databaseURL: "https://gpsdb-f5976-default-rtdb.firebaseio.com",
      projectId: "gpsdb-f5976",
      storageBucket: "gpsdb-f5976.firebasestorage.app",
      messagingSenderId: "649332381832",
      appId: "1:649332381832:web:3854b0d15d3d9230dde73d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Marcador
    let marker = L.marker([0, 0]).addTo(map);

    // ✅ Ruta (línea azul)
    const routeLine = L.polyline([], {
      color: "blue",
      weight: 4,
      opacity: 0.9
    }).addTo(map);

    // ------------------- Suavizado (EMA) -------------------
    // alpha alto = responde rápido (menos retardo) pero menos suave
    // alpha bajo = más suave pero se siente con más retardo
    const EMA_ALPHA = 0.55;         // ✅ buen balance sin “lag” notable
    const MIN_MOVE_M = 4;           // ✅ agrega punto solo si se movió > 4m (evita ruido)
    const MAX_POINTS = 2000;        // ✅ evita que la línea crezca infinito

    let emaLat = null;
    let emaLon = null;
    let lastPoint = null;

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (x) => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function emaUpdate(prev, next, alpha) {
      return (prev == null) ? next : (alpha * next + (1 - alpha) * prev);
    }

    // Firebase RTDB /gps
    const gpsRef = ref(db, "gps");

    onValue(gpsRef, (snap) => {
      const d = snap.val();
      if (!d) return;

      const latRaw = Number(d.lat || 0);
      const lonRaw = Number(d.lon || 0);

      document.getElementById("hora").textContent = d.hora_ecuador ?? "--";
      document.getElementById("lat").textContent  = latRaw.toFixed(6);
      document.getElementById("lon").textContent  = lonRaw.toFixed(6);
      document.getElementById("sats").textContent = d.satelites ?? "--";
      document.getElementById("fix").textContent  = d.fix ? "✅" : "❌";

      if (!latRaw || !lonRaw) return;

      // ✅ Aplicar suavizado EMA (sin lag grande)
      emaLat = emaUpdate(emaLat, latRaw, EMA_ALPHA);
      emaLon = emaUpdate(emaLon, lonRaw, EMA_ALPHA);

      const lat = emaLat;
      const lon = emaLon;

      // ✅ Actualizar marcador
      marker.setLatLng([lat, lon]);

      // ✅ Agregar punto a la ruta solo si realmente se movió
      if (!lastPoint) {
        lastPoint = { lat, lon };
        routeLine.addLatLng([lat, lon]);
        map.setView([lat, lon], 16);
        return;
      }

      const dist = haversineMeters(lastPoint.lat, lastPoint.lon, lat, lon);

      if (dist >= MIN_MOVE_M) {
        routeLine.addLatLng([lat, lon]);
        lastPoint = { lat, lon };

        // Limitar cantidad de puntos (rendimiento)
        const latlngs = routeLine.getLatLngs();
        if (latlngs.length > MAX_POINTS) {
          routeLine.setLatLngs(latlngs.slice(latlngs.length - MAX_POINTS));
        }
      }

      // Centrar mapa en tiempo real (si quieres menos “saltos”, avísame y lo hago opcional)
      map.setView([lat, lon], 16, { animate: true });
    });
  </script>

</body>
</html>
