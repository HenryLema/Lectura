<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tracking GPS en Tiempo Real</title>

  <!-- ✅ MapLibre -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; font-size: 13px; }
    #top { padding: 6px 10px; }
    h3 { margin: 0; font-size: 15px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .box { padding: 4px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
    #map { height: calc(100vh - 60px); }

    .bus-icon { font-size: 24px; transform: translate(-50%, -50%); }
    .stop-icon { font-size: 42px; transform: translate(-50%, -50%); }
  </style>
</head>

<body>
  <div id="top">
    <h3>🚍 GPS en Tiempo Real</h3>
    <div class="row">
      <div class="box">Hora: <b id="hora">--</b></div>
      <div class="box">Lat: <b id="lat">--</b></div>
      <div class="box">Lon: <b id="lon">--</b></div>
      <div class="box">Velocidad: <b id="speed">--</b></div>
      <div class="box">ETA parada 1: <b id="eta">--</b></div>
    </div>
  </div>

  <div id="map"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1PlndJO4Ntcx-1kBF0_9civhqmw6RW6o",
  authDomain: "gpsdb-f5976.firebaseapp.com",
  databaseURL: "https://gpsdb-f5976-default-rtdb.firebaseio.com",
  projectId: "gpsdb-f5976"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------------- ✅ MAPA (MapLibre) ----------------
// Estilo público demo (útil para pruebas)
const map = new maplibregl.Map({
  container: "map",
  style: "https://demotiles.maplibre.org/style.json",
  center: [0, 0],
  zoom: 2
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

// ---------------- PARADAS ----------------
const stops = [
  { id:'p1', name:'Parada 1', lat:0.23081921936948996, lon:-78.25795579701662 },
  { id:'p2', name:'Parada 2', lat:0.2316211933345413,  lon:-78.26659888029099 },
  { id:'p3', name:'Parada 3', lat:0.23828072704662376, lon:-78.28769747167826 }
];

let activeStopId = null;
const stopMarkers = new Map();
const stopPopups  = new Map();

// ---------------- UTIL ----------------
function haversineMeters(lat1, lon1, lat2, lon2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatETA(sec){
  if(!isFinite(sec)||sec<=0) return "--";
  const m=Math.round(sec/60);
  if(m<1) return "< 1 min";
  if(m<60) return `${m} min`;
  return `${Math.floor(m/60)} h ${m%60} min`;
}
function ema(prev, x, alpha){
  return (prev==null) ? x : (alpha*x + (1-alpha)*prev);
}

// ---------------- ✅ ETA REALISTA (sin cambios) ----------------
const ROUTE_FACTOR = 1.45;
const ETA_BIAS_SEC = 45;
const DEFAULT_SPEED_KMH = 10;
const SPEED_ALPHA = 0.35;
const MIN_USABLE_SPEED_KMH = 3.0;
const MAX_REASONABLE_SPEED_KMH = 55;

let speedSmoothed = null;
let lastGoodSpeed = null;
let lastLatLng = null;

function pickSpeedKmh(rawSpeedKmh){
  let s = Number(rawSpeedKmh || 0);
  if (!isFinite(s) || s < 0) s = 0;
  if (s > MAX_REASONABLE_SPEED_KMH) s = MAX_REASONABLE_SPEED_KMH;

  speedSmoothed = ema(speedSmoothed, s, SPEED_ALPHA);

  if (isFinite(speedSmoothed) && speedSmoothed >= MIN_USABLE_SPEED_KMH) {
    lastGoodSpeed = speedSmoothed;
  }

  if (isFinite(speedSmoothed) && speedSmoothed >= MIN_USABLE_SPEED_KMH) return speedSmoothed;
  if (isFinite(lastGoodSpeed) && lastGoodSpeed >= MIN_USABLE_SPEED_KMH) return lastGoodSpeed;
  return DEFAULT_SPEED_KMH;
}

function calcEtaSeconds(distStraightM, usedSpeedKmh){
  const distRoadM = distStraightM * ROUTE_FACTOR;
  const speedMs = usedSpeedKmh / 3.6;
  const etaMove = distRoadM / Math.max(speedMs, 0.1);
  return etaMove + ETA_BIAS_SEC;
}

// ---------------- ✅ ANTI-REBOTE SOLO PARA EL TRAZO ----------------
const HARD_MAX_JUMP_M = 900;
const MAX_SPEED_KMH_SANITY = 90;
const EXTRA_MARGIN = 1.8;
const MIN_ABS_JUMP_M = 120;

let lastAcceptedPoint = null;     // [lat, lon]
let lastAcceptedTimeMs = null;

function acceptForTrail(lat, lon, rawSpeedKmh){
  const now = Date.now();
  if (!lastAcceptedPoint || !lastAcceptedTimeMs) {
    lastAcceptedPoint = [lat, lon];
    lastAcceptedTimeMs = now;
    return true;
  }

  const dtS = Math.max(0.5, (now - lastAcceptedTimeMs) / 1000.0);
  const jumpM = haversineMeters(lastAcceptedPoint[0], lastAcceptedPoint[1], lat, lon);

  if (jumpM > HARD_MAX_JUMP_M) return false;

  let maxSpeedKmh = MAX_SPEED_KMH_SANITY;
  const s = Number(rawSpeedKmh || 0);
  if (isFinite(s) && s > 0 && s < 140) maxSpeedKmh = Math.max(maxSpeedKmh, s * 1.7);

  const allowedM = (maxSpeedKmh / 3.6) * dtS * EXTRA_MARGIN;
  if (jumpM > Math.max(MIN_ABS_JUMP_M, allowedM)) return false;

  lastAcceptedPoint = [lat, lon];
  lastAcceptedTimeMs = now;
  return true;
}

// ---------------- ✅ BUS marker (MapLibre Marker con emoji) ----------------
const busEl = document.createElement("div");
busEl.className = "bus-icon";
busEl.textContent = "🚍";

const busMarker = new maplibregl.Marker({ element: busEl })
  .setLngLat([0, 0])
  .addTo(map);

// ---------------- ✅ TRAIL (línea verde) en MapLibre ----------------
const trailCoords = []; // array de [lon, lat]
const MAX_POINTS = 2000;

function ensureTrailLayers(){
  if (map.getSource("trail")) return;

  map.addSource("trail", {
    type: "geojson",
    data: {
      type: "Feature",
      geometry: { type: "LineString", coordinates: [] }
    }
  });

  map.addLayer({
    id: "trail-line",
    type: "line",
    source: "trail",
    paint: {
      "line-color": "#00aa00",
      "line-width": 6,
      "line-opacity": 0.9
    }
  });
}

function updateTrailLine(){
  const src = map.getSource("trail");
  if (!src) return;

  src.setData({
    type: "Feature",
    geometry: { type: "LineString", coordinates: trailCoords }
  });
}

// ---------------- ✅ Paradas (Markers + Popups) ----------------
function createStops(){
  stops.forEach(s => {
    const el = document.createElement("div");
    el.className = "stop-icon";
    el.textContent = "🚏";

    const popup = new maplibregl.Popup({ offset: 28 })
      .setHTML(`<b>🚏 ${s.name}</b><br>ETA: --<br>Distancia: --`);

    const m = new maplibregl.Marker({ element: el })
      .setLngLat([s.lon, s.lat])
      .setPopup(popup)
      .addTo(map);

    el.addEventListener("click", () => { activeStopId = s.id; });
    popup.on("close", () => { if (activeStopId === s.id) activeStopId = null; });

    stopMarkers.set(s.id, m);
    stopPopups.set(s.id, popup);
  });
}

// ---------------- FIREBASE ----------------
const gpsRef = ref(db,"gps");

map.on("load", () => {
  ensureTrailLayers();
  createStops();

  onValue(gpsRef, snap=>{
    const d=snap.val();
    if(!d || d.fix === false) return;

    const lat = Number(d.lat || 0);
    const lon = Number(d.lon || 0);
    if(!lat || !lon) return;

    const rawSpeedKmh = Number(d.speed_kmh || 0);

    document.getElementById("hora").textContent = d.hora_ecuador ?? "--";
    document.getElementById("lat").textContent  = lat.toFixed(6);
    document.getElementById("lon").textContent  = lon.toFixed(6);

    const usedSpeedKmh = pickSpeedKmh(rawSpeedKmh);

    document.getElementById("speed").textContent =
      `${rawSpeedKmh.toFixed(1)} km/h (ETA usa ${usedSpeedKmh.toFixed(1)})`;

    // mover bus
    busMarker.setLngLat([lon, lat]);

    // mover cámara similar a tu panTo
    map.easeTo({ center: [lon, lat], duration: 400 });
    if (!lastLatLng) map.jumpTo({ center: [lon, lat], zoom: 16 });
    lastLatLng = [lon, lat];

    // ✅ trail (si no es rebote)
    if (acceptForTrail(lat, lon, rawSpeedKmh)) {
      trailCoords.push([lon, lat]);
      if (trailCoords.length > MAX_POINTS) trailCoords.shift();
      updateTrailLine();
    }

    // Panel ETA (Parada 1)
    const s1=stops[0];
    const distStraight = haversineMeters(lat,lon,s1.lat,s1.lon);
    const etaSec1 = calcEtaSeconds(distStraight, usedSpeedKmh);
    document.getElementById("eta").textContent = formatETA(etaSec1);

    // Popup activo
    if(activeStopId){
      const s = stops.find(x=>x.id===activeStopId);
      const popup = stopPopups.get(activeStopId);

      const dist2 = haversineMeters(lat,lon,s.lat,s.lon);
      const eta2 = formatETA(calcEtaSeconds(dist2, usedSpeedKmh));
      const distText = dist2 < 1000 ? `${dist2.toFixed(0)} m` : `${(dist2/1000).toFixed(2)} km`;

      popup.setHTML(
        `<b>🚏 ${s.name}</b>` +
        `<br>ETA: <b>${eta2}</b>` +
        `<br>Distancia: <b>${distText}</b>` +
        `<br>Velocidad usada: <b>${usedSpeedKmh.toFixed(1)} km/h</b>` +
        `<br><small>(ruta x${ROUTE_FACTOR.toFixed(2)} + ${ETA_BIAS_SEC}s)</small>`
      );
    }
  });
});
</script>
</body>
</html>
