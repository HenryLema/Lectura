<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tracking GPS en Tiempo Real</title>

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      font-size: 13px; /* 🔽 texto general más pequeño */
    }

    #top {
      padding: 6px 10px; /* 🔽 menos espacio arriba */
    }

    h3 {
      margin: 0;
      font-size: 15px; /* 🔽 título más pequeño */
    }

    .row {
      display: flex;
      gap: 8px;        /* 🔽 menos espacio entre cajas */
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .box {
      padding: 4px 8px;    /* 🔽 cajas más compactas */
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 12px;     /* 🔽 texto de cajas */
    }

    #map {
      height: calc(100vh - 60px); /* 🔥 más espacio para el mapa */
    }
  </style>
</head>

<body>

  <div id="top">
    <h3>🚍 GPS en Tiempo Real</h3>
    <div class="row">
      <div class="box">Hora: <b id="hora">--</b></div>
      <div class="box">Lat: <b id="lat">--</b></div>
      <div class="box">Lon: <b id="lon">--</b></div>
      <div class="box">Sats: <b id="sats">--</b></div>
      <div class="box">Fix: <b id="fix">--</b></div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Firebase Web SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1PlndJO4Ntcx-1kBF0_9civhqmw6RW6o",
      authDomain: "gpsdb-f5976.firebaseapp.com",
      databaseURL: "https://gpsdb-f5976-default-rtdb.firebaseio.com",
      projectId: "gpsdb-f5976",
      storageBucket: "gpsdb-f5976.firebasestorage.app",
      messagingSenderId: "649332381832",
      appId: "1:649332381832:web:3854b0d15d3d9230dde73d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    let marker = L.marker([0, 0]).addTo(map);

    const gpsRef = ref(db, "gps");

    onValue(gpsRef, (snap) => {
      const d = snap.val();
      if (!d) return;

      const lat = Number(d.lat || 0);
      const lon = Number(d.lon || 0);

      document.getElementById("hora").textContent = d.hora_ecuador ?? "--";
      document.getElementById("lat").textContent  = lat.toFixed(6);
      document.getElementById("lon").textContent  = lon.toFixed(6);
      document.getElementById("sats").textContent = d.satelites ?? "--";
      document.getElementById("fix").textContent  = d.fix ? "✅" : "❌";

      if (lat && lon) {
        marker.setLatLng([lat, lon]);
        map.setView([lat, lon], 16);
      }
    });
  </script>

</body>
</html>
