<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tracking GPS Bus - Tiempo Real</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; font-size: 13px; }
    #top { padding: 6px 10px; }
    h3 { margin: 0; font-size: 15px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .box { padding: 4px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
    #map { height: calc(100vh - 60px); }

    .bus-icon { font-size: 24px; transform: translate(-50%, -50%); }
  </style>
</head>

<body>
  <div id="top">
    <h3>🚍 Rastreo Bus en Tiempo Real (Otavalo)</h3>
    <div class="row">
      <div class="box">Hora: <b id="hora">--</b></div>
      <div class="box">Lat: <b id="lat">--</b></div>
      <div class="box">Lon: <b id="lon">--</b></div>
      <div class="box">Velocidad: <b id="speed">--</b></div>
      <div class="box">Estable: <b id="stable">--</b></div>
      <div class="box">Fallback: <b id="fallback">--</b></div>
    </div>
  </div>

  <div id="map"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "AIzaSyB1PlndJO4Ntcx-1kBF0_9civhqmw6RW6o",
  authDomain: "gpsdb-f5976.firebaseapp.com",
  databaseURL: "https://gpsdb-f5976-default-rtdb.firebaseio.com",
  projectId: "gpsdb-f5976"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------------- MAPA (Otavalo) ----------------
const OTAVALO = [0.2349, -78.2620]; // centro aprox
const map = L.map('map').setView(OTAVALO, 15);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20
}).addTo(map);

const busIcon = L.divIcon({
  className:'bus-icon',
  html:'🚍',
  iconSize:[24,24],
  iconAnchor:[12,12]
});

const busMarker = L.marker(OTAVALO, {icon:busIcon}).addTo(map);

// ---------------- AUTO-FOLLOW CON PAUSA ----------------
const FOLLOW_RESUME_MS = 10000;
let followEnabled = true;
let followTimer = null;

function pauseFollowFor(ms = FOLLOW_RESUME_MS) {
  followEnabled = false;
  if (followTimer) clearTimeout(followTimer);
  followTimer = setTimeout(() => {
    followEnabled = true;
    if (lastShownLatLng) map.setView(lastShownLatLng, map.getZoom(), { animate:true, duration:0.6 });
  }, ms);
}
map.on("zoomstart", () => pauseFollowFor());
map.on("zoom", () => pauseFollowFor());
map.on("dragstart", () => pauseFollowFor());
map.on("movestart", () => pauseFollowFor());

// ---------------- UTIL GEO ----------------
function isValidLatLon(lat, lon){
  return isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && !(lat === 0 && lon === 0);
}
function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000, toRad = x => x * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function ema(prev, x, alpha){
  return (prev == null) ? x : (alpha*x + (1-alpha)*prev);
}

// ---------------- RUTA (LÍNEA VERDE) ----------------
// 1) Ruta “raw estable” (para fallback inmediato visual)
// 2) Ruta “snapped” (pegada a calles) si OSRM responde
const rawTrail = [];
let snappedTrail = []; // será la que se pinta
const MAX_POINTS = 4000;

const trailLine = L.polyline([], {
  color: "green",
  weight: 6,
  opacity: 0.9,
  lineJoin: "round",
  lineCap: "round"
}).addTo(map);

// ---------------- SUAVIZADO VISUAL (SIN SALIRSE MUCHO) ----------------
// - Suaviza en tiempo real: EMA sobre lat/lon para el marcador
// - Para la línea: suavizado leve tipo “moving average” (si NO hay OSRM)
// Nota: si OSRM está activo, ya viene bonito por calles.
const MARKER_ALPHA = 0.45;       // 0.35–0.55 (más alto = más suave)
const LINE_SMOOTH_WINDOW = 3;    // 3 o 5
let markerLatEma = null;
let markerLonEma = null;

function smoothLine(latlngs, windowSize = 3){
  if (latlngs.length < windowSize) return latlngs;
  const half = Math.floor(windowSize / 2);
  const out = [];
  for (let i=0; i<latlngs.length; i++){
    let sumLat=0, sumLon=0, count=0;
    for (let j=i-half; j<=i+half; j++){
      if (j>=0 && j<latlngs.length){
        sumLat += latlngs[j][0];
        sumLon += latlngs[j][1];
        count++;
      }
    }
    out.push([sumLat/count, sumLon/count]);
  }
  return out;
}

// ---------------- REGLAS DE ACEPTACIÓN (SOLO PUNTOS “QUE TIENEN SENTIDO”) ----------------
const MIN_MOVE_M = 6;        // ignora micro-ruido
const MAX_STEP_M = 220;      // si en 3s salta demasiado, no lo agregues (debería venir como fallback ya)
let lastAccepted = null;

function acceptStableForTrail(lat, lon){
  if (!isValidLatLon(lat, lon)) return false;
  if (!lastAccepted) {
    lastAccepted = [lat, lon];
    return true;
  }
  const d = haversineMeters(lastAccepted[0], lastAccepted[1], lat, lon);
  if (d < MIN_MOVE_M) return false;
  if (d > MAX_STEP_M) return false;
  lastAccepted = [lat, lon];
  return true;
}

// ---------------- “SNAP TO ROADS” (OSRM MATCHING) ----------------
// Esto “pega” la línea a calles (como Google Maps) usando OSM.
// Se hace por lotes para no spamear: cada X segundos o cada X puntos.
const USE_OSRM_SNAP = true;           // ✅ pon false si no quieres snapping
const OSRM_MATCH_URL = "https://router.project-osrm.org/match/v1/driving/";
const MATCH_MIN_POINTS = 6;           // mínimo puntos para pedir matching
const MATCH_MAX_BUFFER = 20;          // buffer de puntos para matching
const MATCH_COOLDOWN_MS = 9000;       // cada 9s aprox (para no saturar)
const MATCH_GPS_ACCURACY_M = 25;      // “radio” aproximado del GPS (20–35m)
let matchBuffer = [];
let lastMatchAt = 0;
let lastSnappedTail = null;           // para unir segmentos sin duplicar

function coordsToOsrmString(buffer){
  // OSRM espera lon,lat;lon,lat...
  return buffer.map(p => `${p[1]},${p[0]}`).join(";");
}

function almostSamePoint(a, b, tolM = 3){
  if (!a || !b) return false;
  const d = haversineMeters(a[0], a[1], b[0], b[1]);
  return d <= tolM;
}

function trimMaxPoints(arr){
  if (arr.length > MAX_POINTS) arr.splice(0, arr.length - MAX_POINTS);
}

async function runOsrmMatchIfNeeded(){
  if (!USE_OSRM_SNAP) return;
  const now = Date.now();
  if (now - lastMatchAt < MATCH_COOLDOWN_MS) return;
  if (matchBuffer.length < MATCH_MIN_POINTS) return;

  lastMatchAt = now;

  const coordsStr = coordsToOsrmString(matchBuffer);
  const radiuses = matchBuffer.map(_ => MATCH_GPS_ACCURACY_M).join(";");

  const url =
    `${OSRM_MATCH_URL}${coordsStr}` +
    `?geometries=geojson&overview=full&radiuses=${radiuses}` +
    `&tidy=true`;

  try{
    const res = await fetch(url);
    if (!res.ok) return;
    const js = await res.json();
    if (!js || !js.matchings || !js.matchings.length) return;

    // Tomamos el matching principal
    const geom = js.matchings[0].geometry;
    if (!geom || !geom.coordinates) return;

    const snapped = geom.coordinates.map(c => [c[1], c[0]]); // a [lat,lon]

    // Unir con lo ya dibujado sin repetir el punto inicial
    if (snappedTrail.length === 0){
      snappedTrail = snapped;
    } else {
      // si el primer punto del nuevo snapped coincide con la cola actual, lo saltamos
      const first = snapped[0];
      const tail = snappedTrail[snappedTrail.length - 1];
      let startIdx = 0;
      if (almostSamePoint(first, tail, 8)) startIdx = 1;

      for (let i=startIdx; i<snapped.length; i++){
        snappedTrail.push(snapped[i]);
      }
    }

    trimMaxPoints(snappedTrail);
    trailLine.setLatLngs(snappedTrail);

    // dejamos una pequeña cola para continuidad visual
    lastSnappedTail = snappedTrail[snappedTrail.length - 1];

    // Para que el buffer no crezca infinito: dejamos los últimos 6 puntos
    matchBuffer = matchBuffer.slice(-6);

  }catch(e){
    // si falla OSRM, no pasa nada: seguimos con rawTrail suavizado
  }
}

// ---------------- ESTADO VISUAL ----------------
let lastShownLatLng = null;

// ---------------- FIREBASE LISTENER ----------------
const gpsRef = ref(db, "NodoMovil");

onValue(gpsRef, async (snap) => {
  const d = snap.val();
  if (!d) return;

  // En tu ESP32 nuevo: lat/lon ya vienen como “punto enviado” (estable o fallback)
  const lat = Number(d.lat || 0);
  const lon = Number(d.lon || 0);
  if (!isValidLatLon(lat, lon)) return;

  const rawSpeedKmh = Number(d.speed_kmh || 0);

  // Flags del ESP32 (si no existen, asumimos estable para no romper)
  const puntoEstable = (d.punto_estable === undefined) ? true : (d.punto_estable === true);
  const usoFallback  = (d.uso_fallback === undefined) ? false : (d.uso_fallback === true);

  // Panel
  document.getElementById("hora").textContent = d.hora_ecuador ?? "--";
  document.getElementById("lat").textContent  = lat.toFixed(6);
  document.getElementById("lon").textContent  = lon.toFixed(6);
  document.getElementById("speed").textContent = `${isFinite(rawSpeedKmh) ? rawSpeedKmh.toFixed(1) : "0.0"} km/h`;
  document.getElementById("stable").textContent = puntoEstable ? "✅" : "❌";
  document.getElementById("fallback").textContent = usoFallback ? "✅" : "❌";

  // ---------------- MARCADOR SUAVE ----------------
  markerLatEma = ema(markerLatEma, lat, MARKER_ALPHA);
  markerLonEma = ema(markerLonEma, lon, MARKER_ALPHA);

  const shownPos = [markerLatEma, markerLonEma];
  busMarker.setLatLng(shownPos);

  if (!lastShownLatLng) {
    map.setView(shownPos, 16);
  } else if (followEnabled) {
    map.panTo(shownPos, { animate:true, duration:0.4 });
  }
  lastShownLatLng = shownPos;

  // ---------------- RUTA (SOLO PUNTOS ESTABLES “QUE TIENEN SENTIDO”) ----------------
  // Si viene fallback o punto no estable, NO agregamos (para que no “dibuje saltos”).
  // Solo agregamos cuando realmente avanzó el bus y el punto es confiable.
  if (puntoEstable && !usoFallback) {
    if (acceptStableForTrail(lat, lon)) {
      rawTrail.push([lat, lon]);
      trimMaxPoints(rawTrail);

      // Buffer para OSRM
      if (USE_OSRM_SNAP) {
        matchBuffer.push([lat, lon]);
        if (matchBuffer.length > MATCH_MAX_BUFFER) matchBuffer.shift();
        // Lanzamos matching en background (no bloquea UI)
        runOsrmMatchIfNeeded();
      }

      // Si OSRM está apagado o todavía no respondió, dibujamos “bonito” con suavizado leve
      if (!USE_OSRM_SNAP || snappedTrail.length === 0) {
        const smooth = smoothLine(rawTrail, LINE_SMOOTH_WINDOW);
        trailLine.setLatLngs(smooth);
      }
    }
  } else {
    // Punto loco / fallback: mantenemos la ruta como está (continúa con el último estable)
    // (el marcador ya se mueve suave hacia el punto enviado, que es el último estable)
  }
});
</script>
</body>
</html>
