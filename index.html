function formatDistOLED(m){
  if(!isFinite(m) || m < 0) return "--";
  if(m < 1000) return `${Math.round(m)}m`;
  return `${(m/1000).toFixed(2)}km`;
}
function formatEtaOLED(sec){
  if(!isFinite(sec) || sec <= 0) return "--";
  const totalMin = Math.round((sec + 30) / 60);
  if(totalMin < 1) return "<1m";
  if(totalMin < 60) return `${totalMin}min`;
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h}h ${m}m`;
}

// ---------------- UTIL ----------------
function haversineMeters(lat1, lon1, lat2, lon2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatETA(sec){
  if(!isFinite(sec)||sec<=0) return "--";
  const m=Math.round(sec/60);
  if(m<1) return "< 1 min";
  if(m<60) return `${m} min`;
  return `${Math.floor(m/60)} h ${m%60} min`;
}
function ema(prev, x, alpha){
  return (prev==null) ? x : (alpha*x + (1-alpha)*prev);
}
function ema2(prev2, x2, alpha){
  if(!prev2) return x2;
  return [ ema(prev2[0], x2[0], alpha), ema(prev2[1], x2[1], alpha) ];
}
function formatDist(m){
  if(!isFinite(m) || m<=0) return "--";
  return (m < 1000) ? `${m.toFixed(0)} m` : `${(m/1000).toFixed(2)} km`;
}

// ---------------- ✅ ETA REALISTA ----------------
const ROUTE_FACTOR = 1.45;
const ETA_BIAS_SEC = 45;
const DEFAULT_SPEED_KMH = 4.0;     // ✅ antes 5.0, ahora 4.0
const SPEED_ALPHA = 0.35;
const MIN_USABLE_SPEED_KMH = 3.0;
const MAX_REASONABLE_SPEED_KMH = 55;

let speedSmoothed = null;
let lastGoodSpeed = null;

function pickSpeedKmh(rawSpeedKmh){
  let s = Number(rawSpeedKmh || 0);
  if (!isFinite(s) || s < 0) s = 0;
  if (s > MAX_REASONABLE_SPEED_KMH) s = MAX_REASONABLE_SPEED_KMH;

  speedSmoothed = ema(speedSmoothed, s, SPEED_ALPHA);

  if (isFinite(speedSmoothed) && speedSmoothed >= MIN_USABLE_SPEED_KMH) lastGoodSpeed = speedSmoothed;

  if (isFinite(speedSmoothed) && speedSmoothed >= MIN_USABLE_SPEED_KMH) return speedSmoothed;
  if (isFinite(lastGoodSpeed) && lastGoodSpeed >= MIN_USABLE_SPEED_KMH) return lastGoodSpeed;
  return DEFAULT_SPEED_KMH;
}
function calcEtaSeconds(distStraightM, usedSpeedKmh){
  const distRoadM = distStraightM * ROUTE_FACTOR;
  const speedMs = usedSpeedKmh / 3.6;
  const etaMove = distRoadM / Math.max(speedMs, 0.1);
  return etaMove + ETA_BIAS_SEC;
}

// ---------------- ✅ “Calles” (reverse geocode con Nominatim) ----------------
// (con cache + rate limit)
const STREET_MOVE_M = 20;
const STREET_COOLDOWN_MS = 2000;
let lastStreetAt = 0;
let lastStreetLatLon = null;
const streetCache = new Map();

function streetKey(lat, lon){
  // redondea para cachear sin spamear
  return `${lat.toFixed(5)},${lon.toFixed(5)}`;
}

async function reverseStreet(lat, lon){
  const key = streetKey(lat, lon);
  if(streetCache.has(key)) return streetCache.get(key);

  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`;
  try{
    const r = await fetch(url, {
      cache: "no-store",
      headers: { "Accept":"application/json" }
    });
    if(!r.ok) return "";
    const j = await r.json();
    const a = j?.address || {};
    const road = a.road || a.pedestrian || a.footway || a.path || a.cycleway || "";
    const neigh = a.neighbourhood || a.suburb || a.quarter || a.city_district || "";
    const city = a.city || a.town || a.village || "";
    const txt = [road, neigh, city].filter(Boolean).join(" - ");
    streetCache.set(key, txt);
    return txt;
  }catch(e){
    return "";
  }
}

function maybeUpdateStreetAsync(lat, lon, rowObj){
  const now = Date.now();

  if(lastStreetLatLon){
    const dm = haversineMeters(lastStreetLatLon[0], lastStreetLatLon[1], lat, lon);
    if(dm < STREET_MOVE_M) return;
  }
  if(now - lastStreetAt < STREET_COOLDOWN_MS) return;

  lastStreetAt = now;
  lastStreetLatLon = [lat, lon];

  reverseStreet(lat, lon).then(st => {
    if(st){
      rowObj.calle = st;
      renderHistoryTable();
    }
  });
}

// ---------------- ✅ RUTA VERDE: siempre “empuja” puntos (sin bloquear por OSRM) ----------------

// Decodifica polyline6 (OSRM)
function decodePolyline6(str){
  let index=0, lat=0, lng=0, coordinates=[];
  const factor = 1e6;
  while(index < str.length){
    let b, shift=0, result=0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dlat;

    shift=0; result=0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
    lng += dlng;

    coordinates.push([lat / factor, lng / factor]);
  }
  return coordinates;
}

function chooseStablePoint(lat, lon){
  const p = [lat, lon];
  if(!lastStableDraw){
    lastStableDraw = p;
    return { point: p, usedFallback: false, jumpM: 0 };
  }
  const jumpM = haversineMeters(lastStableDraw[0], lastStableDraw[1], p[0], p[1]);
  if (jumpM > MAX_JUMP_DRAW_M) {
    return { point: lastStableDraw, usedFallback: true, jumpM };
  }
  lastStableDraw = p;
  return { point: p, usedFallback: false, jumpM };
}

function bufferMoveDistanceM(buf){
  if(buf.length < 2) return 0;
  let sum = 0;
  for(let i=1;i<buf.length;i++){
    sum += haversineMeters(buf[i-1].lat, buf[i-1].lon, buf[i].lat, buf[i].lon);
  }
  return sum;
}

// OSRM nearest (se usa como “mejora”, pero si tarda NO bloquea)
async function osrmNearest(lat, lon){
  const now = Date.now();
  if (now - lastNearestAt < NEAREST_COOLDOWN_MS && lastNearestRoad) return lastNearestRoad;
  lastNearestAt = now;

  const url = `https://router.project-osrm.org/nearest/v1/driving/${lon},${lat}?number=1`;
  try{
    const r = await fetch(url, { cache:"no-store" });
    if(!r.ok) return null;
    const j = await r.json();
    const loc = j?.waypoints?.[0]?.location;
    if(!loc) return null;

    const snapped = [Number(loc[1]), Number(loc[0])];
    const dist = haversineMeters(lat, lon, snapped[0], snapped[1]);
    if(!isFinite(dist) || dist > NEAREST_MAX_DIST_M) return null;

    lastNearestRoad = snapped;
    return snapped;
  }catch(e){
    return null;
  }
}

async function osrmMatch(buf){
  const now = Date.now();
  if (now - lastOsrmAt < OSRM_COOLDOWN_MS) return null;
  lastOsrmAt = now;

  if(buf.length < 3) return null;
  const movedM = bufferMoveDistanceM(buf);
  if (movedM < OSRM_MIN_MOVE_M) return null;

  const coords = buf.map(p => `${p.lon},${p.lat}`).join(";");
  const radiuses = buf.map(_ => `${OSRM_GPS_RADIUS_M}`).join(";");

  const t0 = buf[0].t;
  const times = buf.map(p => Math.max(0, Math.round((p.t - t0)/1000))).join(";");

  const url = `https://router.project-osrm.org/match/v1/driving/${coords}` +
              `?geometries=polyline6&overview=full&radiuses=${radiuses}&timestamps=${times}`;

  try{
    const r = await fetch(url, { cache:"no-store" });
    if(!r.ok) return null;
    const j = await r.json();

    const geom = j?.matchings?.[0]?.geometry;
    if(!geom) return null;

    const line = decodePolyline6(geom);
    if(!line || line.length < 2) return null;
    return line;
  }catch(e){
    return null;
  }
}

function replaceLastTrailWith(matchedLine, replaceN){
  if(!matchedLine || matchedLine.length < 2) return false;
  if (matchedLine.length > 2500) return false;

  const n = Math.max(0, Math.min(replaceN, trailLatLngs.length));
  if(n > 0) trailLatLngs.splice(trailLatLngs.length - n, n);

  let startIdx = 0;
  if(trailLatLngs.length > 0){
    const last = trailLatLngs[trailLatLngs.length-1];
    for(let i=0;i<matchedLine.length;i++){
      const dd = haversineMeters(last[0], last[1], matchedLine[i][0], matchedLine[i][1]);
      if(dd < 8){ startIdx = i+1; break; }
    }
  }

  for(let i=startIdx;i<matchedLine.length;i++){
    trailLatLngs.push(matchedLine[i]);
    if (trailLatLngs.length > MAX_POINTS) trailLatLngs.shift();
  }
  trailLine.setLatLngs(trailLatLngs);
  lastMatchedTail = matchedLine[matchedLine.length-1];
  return true;
}

// ✅ Dibujo “forzado” y persistente: SIEMPRE añade un punto rápido,
// y por detrás intenta mejorar con /nearest + /match (sin cortar la línea)
function updateGreenTrailForced(rawLat, rawLon){
  const chosen = chooseStablePoint(rawLat, rawLon);
  const stablePoint = chosen.point;
  lastSmoothed = ema2(lastSmoothed, stablePoint, SMOOTH_ALPHA_POS);

  // 1) punto inmediato (no bloquea)
  const fastPoint = (lastNearestRoad ? lastNearestRoad : lastSmoothed);
  if(trailLatLngs.length === 0){
    pushTrail(fastPoint);
  } else {
    const last = trailLatLngs[trailLatLngs.length - 1];
    const d = haversineMeters(last[0], last[1], fastPoint[0], fastPoint[1]);
    if(d >= MIN_ADD_DIST_M) pushTrail(fastPoint);
  }

  // 2) mejora con OSRM nearest (async)
  osrmNearest(lastSmoothed[0], lastSmoothed[1]).then(roadPoint => {
    if(!roadPoint) return;

    // si nearest aporta algo, empújalo (sin borrar)
    if(trailLatLngs.length > 0){
      const last = trailLatLngs[trailLatLngs.length - 1];
      const d = haversineMeters(last[0], last[1], roadPoint[0], roadPoint[1]);
      if(d >= MIN_ADD_DIST_M) pushTrail(roadPoint);
    } else {
      pushTrail(roadPoint);
    }

    // buffer para match (si aplica)
    matchBuf.push({ lat: roadPoint[0], lon: roadPoint[1], t: Date.now() });
    if(matchBuf.length > OSRM_MATCH_WINDOW) matchBuf.shift();

    if(matchBuf.length >= Math.min(OSRM_MATCH_WINDOW, 6) && !chosen.usedFallback){
      osrmMatch(matchBuf).then(matchedLine => {
        if(matchedLine && matchedLine.length >= 2){
          replaceLastTrailWith(matchedLine, Math.min(matchBuf.length + 2, 18));
        }
      });
    }
  });
}

// ---------------- FIREBASE ----------------
const gpsRef = ref(db, "NodoMovil");
const nfRef  = ref(db, "NodoFijo");

// Listener NodoFijo
onValue(nfRef, (snap)=>{
  const d = snap.val();
  if(!d) return;

  const lat = Number(d.lat || 0);
  const lon = Number(d.lon || 0);
  if(!lat || !lon) return;

  nodoFijoLast.hora = d.hora_ecuador ?? "--";
  nodoFijoLast.fix  = (d.fix === true);
  nodoFijoLast.sats = Number(d.satelites ?? d.satellites ?? 0);
  nodoFijoLast.hdop = (d.hdop !== undefined) ? Number(d.hdop) : null;

  nodoFijoLast.dist_m = (d.bus_dist_m !== undefined) ? Number(d.bus_dist_m) : null;
  nodoFijoLast.eta_s  = (d.bus_eta_s  !== undefined) ? Number(d.bus_eta_s)  : null;

  upsertNodoFijoMarker(lat, lon);
});

// =======================================================
// ✅ Motor FORZADO cada 3 segundos (sin “lag” por OSRM)
// =======================================================
const FORCE_DRAW_MS = 3000;
let latestBusData = null;

function setBusMovingState(isMoving){
  if(busIsMoving === isMoving) return;
  busIsMoving = isMoving;
  busIcon = L.divIcon({ className:'', html: makeBusIconHtml(busIsMoving), iconSize:[30,30], iconAnchor:[15,15] });
  busMarker.setIcon(busIcon);
}

// 1) Listener: SOLO guarda el último dato
onValue(gpsRef, (snap)=>{
  const d = snap.val();
  if(!d) return;
  latestBusData = d;
});

// aplica datos a UI/mapa (sin romper lo que ya funcionaba)
function applyBusDataToUIAndMap(d){
  const lat = Number(d.lat || 0);
  const lon = Number(d.lon || 0);
  if(!lat || !lon) return null;

  const rawSpeedKmh = Number(d.speed_kmh || 0);

  document.getElementById("hora").textContent = d.hora_ecuador ?? "--";
  document.getElementById("lat").textContent  = lat.toFixed(6);
  document.getElementById("lon").textContent  = lon.toFixed(6);

  const usedSpeedKmh = pickSpeedKmh(rawSpeedKmh);
  document.getElementById("speed").textContent =
    `${rawSpeedKmh.toFixed(1)} km/h (ETA usa ${usedSpeedKmh.toFixed(1)})`;

  // estado movimiento (verde/negro)
  const moving = rawSpeedKmh >= 1.0;  // umbral simple
  setBusMovingState(moving);

  // bus marker
  const busPos=[lat,lon];
  busMarker.setLatLng(busPos);

  if (followEnabled) map.panTo(busPos,{animate:true,duration:0.4});
  if(!lastLatLng) map.setView(busPos,16);
  lastLatLng=busPos;

  return { lat, lon, rawSpeedKmh, usedSpeedKmh, hora: (d.hora_ecuador ?? "--") };
}

// 2) Timer fijo: dibuja CADA 3 SEGUNDOS sí o sí (persistente)
setInterval(()=>{
  if(!latestBusData) return;

  const info = applyBusDataToUIAndMap(latestBusData);
  if(!info) return;

  // ✅ fuerza la ruta (persistente; NO se borra salvo botones)
  updateGreenTrailForced(info.lat, info.lon);

  // ✅ agrega fila a la tabla (10 filas, 5 columnas)
  const row = {
    lat: info.lat.toFixed(6),
    lon: info.lon.toFixed(6),
    hora: String(info.hora).length >= 19 ? String(info.hora).substring(11) : String(info.hora),
    calle: "", // se llena async
    vel: info.rawSpeedKmh.toFixed(1)
  };
  historyRows.unshift(row);
  if(historyRows.length > HISTORY_MAX) historyRows.length = HISTORY_MAX;

  // calles async (sin spamear)
  maybeUpdateStreetAsync(info.lat, info.lon, row);

  // ✅ popup bus: velocidad (con color) + tabla scroll
  lastPopupSpeedKmh = info.rawSpeedKmh;
  if(busMarker.isPopupOpen()){
    busMarker.setPopupContent(buildBusPopupHtml(lastPopupSpeedKmh, busIsMoving));
  } else {
    // deja preparado el contenido actualizado aunque no esté abierto
    busMarker.setPopupContent(buildBusPopupHtml(lastPopupSpeedKmh, busIsMoving));
  }

  // ✅ si el popup de una parada está abierto, actualiza ETA/Dist
  if(activeStopId){
    if(activeStopId === NODO_FIJO_ID && nodoFijoMarker){
      nodoFijoMarker.setPopupContent(buildNodoFijoPopupHtml());
    } else {
      const s = stops.find(x=>x.id===activeStopId);
      const m = stopMarkers.get(activeStopId);
      if(s && m){
        const dist2 = haversineMeters(info.lat, info.lon, s.lat, s.lon);
        const eta2 = formatETA(calcEtaSeconds(dist2, info.usedSpeedKmh));
        const distText = formatDist(dist2);

        m.setPopupContent(
          `<b>🚏 ${s.name}</b>` +
          `<br>LLega: <b>${eta2}</b>` +
          `<br>Distancia: <b>${distText}</b>` +
          `<br>Velocidad Actual: <b>${info.usedSpeedKmh.toFixed(1)} km/h</b>` +
          `<br><small>(ruta x${ROUTE_FACTOR.toFixed(2)} + ${ETA_BIAS_SEC}s)</small>`
        );
      }
    }
  }
}, FORCE_DRAW_MS);

// al abrir el popup del bus, pausa seguimiento para que el usuario lo lea
busMarker.on("popupopen", ()=> pauseFollowFor());
