<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tracking GPS en Tiempo Real</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; font-size: 13px; }
    #top { padding: 6px 10px; }
    h3 { margin: 0; font-size: 15px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .box { padding: 4px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
    #map { height: calc(100vh - 60px); }

    .bus-icon { font-size: 24px; transform: translate(-50%, -50%); }

    /* ✅ Paradas SIN color (solo ícono) */
    .stop-icon {
      font-size: 42px;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <div id="top">
    <h3>🚍 GPS en Tiempo Real</h3>
    <div class="row">
      <div class="box">Hora: <b id="hora">--</b></div>
      <div class="box">Lat: <b id="lat">--</b></div>
      <div class="box">Lon: <b id="lon">--</b></div>
      <div class="box">Velocidad: <b id="speed">--</b></div>
      //<div class="box">ETA Nodo Fijo: <b id="eta_nf">--</b></div>
     // <div class="box">Dist Nodo Fijo: <b id="dist_nf">--</b></div>
    </div>
  </div>

  <div id="map"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1PlndJO4Ntcx-1kBF0_9civhqmw6RW6o",
  authDomain: "gpsdb-f5976.firebaseapp.com",
  databaseURL: "https://gpsdb-f5976-default-rtdb.firebaseio.com",
  projectId: "gpsdb-f5976"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------------- MAPA ----------------
const map = L.map('map').setView([0,0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const busIcon  = L.divIcon({ className:'bus-icon',  html:'🚍', iconSize:[24,24], iconAnchor:[12,12] });
const stopIcon = L.divIcon({ className:'stop-icon', html:'🚏', iconSize:[42,42], iconAnchor:[21,21] });

const busMarker = L.marker([0,0], {icon:busIcon}).addTo(map);

// ---------------- ✅ AUTO-FOLLOW CON PAUSA 10s POR ZOOM/MOVER ----------------
const FOLLOW_RESUME_MS = 10000; // 10 segundos
let followEnabled = true;
let followTimer = null;

function pauseFollowFor(ms = FOLLOW_RESUME_MS) {
  followEnabled = false;
  if (followTimer) clearTimeout(followTimer);
  followTimer = setTimeout(() => {
    followEnabled = true;
    if (lastLatLng) {
      map.setView(lastLatLng, map.getZoom(), { animate: true, duration: 0.6 });
    }
  }, ms);
}

// Detecta zoom (rueda/pinch/botones)
map.on("zoomstart", () => pauseFollowFor());
map.on("zoom", () => pauseFollowFor());

// Detecta mover mapa (drag)
map.on("dragstart", () => pauseFollowFor());
map.on("movestart", () => pauseFollowFor());

// ---------------- ✅ RECORRIDO (LÍNEA VERDE EN TIEMPO REAL) ----------------
const trailLatLngs = [];
const trailLine = L.polyline(trailLatLngs, { color: "green", weight: 6, opacity: 0.9 }).addTo(map);
const MAX_POINTS = 2500;

// ✅ Parámetros visuales de suavizado y anti-saltos (solo para la línea)
const MIN_ADD_DIST_M   = 6;        // no agregues puntos casi iguales
const MAX_JUMP_DRAW_M  = 200;      // si viene un salto grande, NO lo dibujes (mantén estable)

// ✅ NUEVO: suavizado ADAPTATIVO (evita “cortar” curvas y centra mejor en calles)
const ALPHA_STRAIGHT = 0.30;       // más suave en rectas (reduce jitter)
const ALPHA_TURN     = 0.68;       // más reactivo en curvas (no corta la esquina)
const TURN_START_DEG = 12;         // desde aquí empieza a subir alpha
const TURN_FULL_DEG  = 55;         // desde aquí usa alpha de curva
const FREEZE_SPEED_KMH = 1.8;      // si está casi quieto, congelar para evitar serpenteo
const FREEZE_DIST_M    = 10;       // si el punto se mueve poquito y está casi quieto, no lo agregues

let lastStableDraw = null;         // [lat, lon] estable para dibujar
let lastSmoothed   = null;         // [lat, lon] suavizado
let lastStablePrev = null;         // [lat, lon] punto estable anterior (para calcular curva)

// ---------------- PARADAS (FIJAS EN LISTA) ----------------
const stops = [
  { id:'p1',  name:'Parada 1',  lat:0.237746, lon:-78.288787 },
  { id:'p2',  name:'Parada 2',  lat:0.237163, lon:-78.289931 },
  { id:'p3',  name:'Parada 3',  lat:0.236436, lon:-78.291429 },
  { id:'p4',  name:'Parada 4',  lat:0.235681, lon:-78.292848 },
  { id:'p5',  name:'Parada 5',  lat:0.235104, lon:-78.291241 },
  { id:'p6',  name:'Parada 6',  lat:0.235786, lon:-78.290140 },
  { id:'p7',  name:'Parada 7',  lat:0.236424, lon:-78.288876 },
  { id:'p8',  name:'Parada 8',  lat:0.236883, lon:-78.287719 },
  { id:'p9',  name:'Parada 9',  lat:0.237852, lon:-78.288037 },
  { id:'p10', name:'Parada 10', lat:0.238660, lon:-78.286751 },
  { id:'p11', name:'Parada 11', lat:0.239912, lon:-78.284246 },
  { id:'p12', name:'Parada 12', lat:0.242999, lon:-78.270747 },
  { id:'p13', name:'Parada 13', lat:0.241624, lon:-78.269569 },
  { id:'p14', name:'Parada 14', lat:0.240486, lon:-78.268508 },
  { id:'p15', name:'Parada 15', lat:0.239755, lon:-78.267897 },
  { id:'p16', name:'Parada 16', lat:0.233919, lon:-78.269057 },
  { id:'p17', name:'Parada 17', lat:0.232860, lon:-78.268092 },
  { id:'p18', name:'Parada 18', lat:0.231621, lon:-78.266599 },
  { id:'p19', name:'Parada 19', lat:0.230428, lon:-78.264489 },
  { id:'p20', name:'Parada 20', lat:0.232345, lon:-78.263145 },
  { id:'p21', name:'Parada 21', lat:0.231442, lon:-78.261943 },
  { id:'p22', name:'Parada 22', lat:0.229405, lon:-78.259257 },
  { id:'p23', name:'Parada 23', lat:0.230843, lon:-78.257985 }
];

const stopMarkers = new Map();
let activeStopId = null;

// Crear markers de paradas fijas
stops.forEach(s => {
  const m = L.marker([s.lat, s.lon], {icon:stopIcon}).addTo(map);
  m.bindPopup(`<b>🚏 ${s.name}</b><br>ETA: --<br>Distancia: --`);
  m.on("popupopen", ()=>{ activeStopId = s.id; pauseFollowFor(); });
  m.on("popupclose", ()=>{ if(activeStopId===s.id) activeStopId=null; });
  stopMarkers.set(s.id, m);
});

// ---------------- ✅ NODO FIJO DESDE FIREBASE (/NodoFijo) ----------------
const nodoFijo = { id: "nf", name: "Nodo Fijo", lat: null, lon: null };
let nodoFijoMarker = null;

function upsertNodoFijoMarker(lat, lon) {
  if (!nodoFijoMarker) {
    nodoFijoMarker = L.marker([lat, lon], { icon: stopIcon }).addTo(map);
    nodoFijoMarker.bindPopup(`<b>🚏 Nodo Fijo</b><br>ETA: --<br>Distancia: --`);
    nodoFijoMarker.on("popupopen", ()=>{ activeStopId = nodoFijo.id; pauseFollowFor(); });
    nodoFijoMarker.on("popupclose", ()=>{ if(activeStopId===nodoFijo.id) activeStopId=null; });
    stopMarkers.set(nodoFijo.id, nodoFijoMarker);
  } else {
    nodoFijoMarker.setLatLng([lat, lon]);
  }
}

// ---------------- UTIL ----------------
function haversineMeters(lat1, lon1, lat2, lon2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatETA(sec){
  if(!isFinite(sec)||sec<=0) return "--";
  const m=Math.round(sec/60);
  if(m<1) return "< 1 min";
  if(m<60) return `${m} min`;
  return `${Math.floor(m/60)} h ${m%60} min`;
}
function ema(prev, x, alpha){
  return (prev==null) ? x : (alpha*x + (1-alpha)*prev);
}
function ema2(prev2, x2, alpha){
  if(!prev2) return x2;
  return [ ema(prev2[0], x2[0], alpha), ema(prev2[1], x2[1], alpha) ];
}
function formatDist(m){
  if(!isFinite(m) || m<=0) return "--";
  return (m < 1000) ? `${m.toFixed(0)} m` : `${(m/1000).toFixed(2)} km`;
}
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function bearingDeg(a, b){
  const toRad = x => x*Math.PI/180;
  const toDeg = x => x*180/Math.PI;
  const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
  const dLon = toRad(b[1]-a[1]);
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  let brng = toDeg(Math.atan2(y, x));
  brng = (brng + 360) % 360;
  return brng;
}
function angleDiffDeg(a, b){
  let d = Math.abs(a - b) % 360;
  if (d > 180) d = 360 - d;
  return d;
}

// ---------------- ✅ ETA REALISTA ----------------
const ROUTE_FACTOR = 1.45;
const ETA_BIAS_SEC = 45;
const DEFAULT_SPEED_KMH = 5;
const SPEED_ALPHA = 0.35;
const MIN_USABLE_SPEED_KMH = 3.0;
const MAX_REASONABLE_SPEED_KMH = 55;

let speedSmoothed = null;
let lastGoodSpeed = null;
let lastLatLng = null;

function pickSpeedKmh(rawSpeedKmh){
  let s = Number(rawSpeedKmh || 0);
  if (!isFinite(s) || s < 0) s = 0;
  if (s > MAX_REASONABLE_SPEED_KMH) s = MAX_REASONABLE_SPEED_KMH;

  speedSmoothed = ema(speedSmoothed, s, SPEED_ALPHA);

  if (isFinite(speedSmoothed) && speedSmoothed >= MIN_USABLE_SPEED_KMH) {
    lastGoodSpeed = speedSmoothed;
  }

  if (isFinite(speedSmoothed) && speedSmoothed >= MIN_USABLE_SPEED_KMH) return speedSmoothed;
  if (isFinite(lastGoodSpeed) && lastGoodSpeed >= MIN_USABLE_SPEED_KMH) return lastGoodSpeed;
  return DEFAULT_SPEED_KMH;
}

function calcEtaSeconds(distStraightM, usedSpeedKmh){
  const distRoadM = distStraightM * ROUTE_FACTOR;
  const speedMs = usedSpeedKmh / 3.6;
  const etaMove = distRoadM / Math.max(speedMs, 0.1);
  return etaMove + ETA_BIAS_SEC;
}

// ---------------- ✅ RUTA VERDE “CENTRADA” (anti-locos + suavizado ADAPTATIVO) ----------------

// Agrega al polyline, con recorte de máximo
function pushTrail(latLng){
  trailLatLngs.push(latLng);
  if (trailLatLngs.length > MAX_POINTS) trailLatLngs.shift();
  trailLine.setLatLngs(trailLatLngs);
}

// Decide si un punto nuevo es “dibujable” o si usamos el último estable
function chooseStablePoint(lat, lon){
  const p = [lat, lon];

  if(!lastStableDraw){
    lastStableDraw = p;
    lastStablePrev = null;
    return { point: p, usedFallback: false, jumpM: 0 };
  }

  const jumpM = haversineMeters(lastStableDraw[0], lastStableDraw[1], p[0], p[1]);

  // Si viene salto loco -> NO aceptes (mantén último estable)
  if (jumpM > MAX_JUMP_DRAW_M) {
    return { point: lastStableDraw, usedFallback: true, jumpM };
  }

  // Acepta como estable (y guarda el anterior para detectar curvas)
  lastStablePrev = lastStableDraw;
  lastStableDraw = p;
  return { point: p, usedFallback: false, jumpM };
}

function computeAdaptiveAlpha(stablePoint, speedKmh){
  // si no hay anterior, usa un alpha medio
  if(!lastStablePrev) return 0.50;

  const b1 = bearingDeg(lastStablePrev, lastStableDraw); // dirección previa
  const b2 = bearingDeg(lastStableDraw, stablePoint);    // dirección actual (aprox)
  const turn = angleDiffDeg(b1, b2);

  // recta -> alpha bajo (suaviza más), curva -> alpha alto (sigue la calle)
  const t = clamp((turn - TURN_START_DEG) / (TURN_FULL_DEG - TURN_START_DEG), 0, 1);
  let alpha = lerp(ALPHA_STRAIGHT, ALPHA_TURN, t);

  // a mayor velocidad, un poco más reactivo (para no atrasarse)
  const s = clamp((Number(speedKmh||0) - 8) / 30, 0, 1); // 0..1
  alpha = clamp(alpha + 0.10*s, 0.22, 0.78);

  return alpha;
}

// Suaviza (EMA adaptativo) y agrega al polyline
async function updateGreenTrail(rawLat, rawLon, rawSpeedKmh){
  // 1) escoger punto estable (si loco -> usa último estable)
  const chosen = chooseStablePoint(rawLat, rawLon);
  const stablePoint = chosen.point;

  // 2) si está casi quieto: congelar para que NO se vaya a los lados de la calle
  if (lastSmoothed && Number(rawSpeedKmh||0) < FREEZE_SPEED_KMH) {
    const dFreeze = haversineMeters(lastSmoothed[0], lastSmoothed[1], stablePoint[0], stablePoint[1]);
    if (dFreeze < FREEZE_DIST_M) {
      // no agregamos y mantenemos el último suavizado
      return { ...chosen, smoothed: lastSmoothed, added: false, frozen: true };
    }
  }

  // 3) alpha adaptativo: en curvas sube (no corta), en rectas baja (centra/jitter)
  const alphaPos = computeAdaptiveAlpha(stablePoint, rawSpeedKmh);

  // 4) suavizado de posición
  lastSmoothed = ema2(lastSmoothed, stablePoint, alphaPos);

  // 5) no agregar si casi no se movió
  if(trailLatLngs.length > 0){
    const last = trailLatLngs[trailLatLngs.length - 1];
    const d = haversineMeters(last[0], last[1], lastSmoothed[0], lastSmoothed[1]);
    if (d < MIN_ADD_DIST_M) return { ...chosen, smoothed: lastSmoothed, added: false };
  }

  // 6) agregar punto suavizado
  pushTrail(lastSmoothed);
  return { ...chosen, smoothed: lastSmoothed, added: true };
}

// ---------------- ✅ ANTI-REBOTE EN REPOSO (SOLO PARA ETA/LOGICA ORIGINAL) ----------------
const STOP_SPEED_KMH = 1.5;
const MIN_MOVE_M = 8;
const IDLE_JUMP_BLOCK_M = 40;

let lastTrailPoint = null;

function acceptForTrail(lat, lon, rawSpeedKmh){
  const s = Number(rawSpeedKmh || 0);
  if (!isFinite(s) || s < 0) return false;

  if (!lastTrailPoint){
    lastTrailPoint = [lat, lon];
    return true;
  }

  const jumpM = haversineMeters(lastTrailPoint[0], lastTrailPoint[1], lat, lon);

  if (s < STOP_SPEED_KMH) {
    if (jumpM > IDLE_JUMP_BLOCK_M) return false;
    return false;
  }

  if (jumpM < MIN_MOVE_M) return false;

  lastTrailPoint = [lat, lon];
  return true;
}

// ---------------- FIREBASE ----------------
const gpsRef = ref(db, "NodoMovil");
const nfRef = ref(db, "NodoFijo");

// 1) Listener del Nodo Fijo
onValue(nfRef, snap => {
  const d = snap.val();
  if(!d) return;

  const hasFix = (d.fijo_ok === true) || (d.fix === true) || (d.fix === undefined);

  const lat = Number(d.lat || 0);
  const lon = Number(d.lon || 0);
  if(!hasFix || !lat || !lon) return;

  nodoFijo.lat = lat;
  nodoFijo.lon = lon;

  upsertNodoFijoMarker(lat, lon);
});

// 2) Listener del GPS del bus
onValue(gpsRef, async (snap)=>{
  const d = snap.val();
  if(!d) return;

  // ✅ TU ESP32 NUEVO manda: gps_fix, punto_estable, uso_fallback, lat, lon
  // pero si tu nodo aún manda fix, esto igual funciona:
  const fix = (d.gps_fix !== undefined) ? d.gps_fix : d.fix;

  // Si no hay fix real y tampoco hay lat/lon, no podemos actualizar
  const lat = Number(d.lat || 0);
  const lon = Number(d.lon || 0);
  if(!lat || !lon) return;

  const rawSpeedKmh = Number(d.speed_kmh || 0);

  // Panel
  document.getElementById("hora").textContent = d.hora_ecuador ?? "--";
  document.getElementById("lat").textContent  = lat.toFixed(6);
  document.getElementById("lon").textContent  = lon.toFixed(6);

  const usedSpeedKmh = pickSpeedKmh(rawSpeedKmh);
  document.getElementById("speed").textContent =
    `${rawSpeedKmh.toFixed(1)} km/h (ETA usa ${usedSpeedKmh.toFixed(1)})`;

  // Bus en mapa (posición instantánea)
  const busPos=[lat,lon];
  busMarker.setLatLng(busPos);

  // ✅ Solo seguir al bus si NO hay interacción reciente (zoom/mover)
  if (followEnabled) {
    map.panTo(busPos,{animate:true,duration:0.4});
  }

  if(!lastLatLng) map.setView(busPos,16);
  lastLatLng=busPos;

  // ✅ Recorrido verde centrado: anti-locos + suavizado adaptativo (mejor en curvas)
  await updateGreenTrail(lat, lon, rawSpeedKmh);

  // ------ (Tu lógica original de ETA / popups se mantiene igual) ------

  // ETA Nodo Fijo
  if (nodoFijo.lat != null && nodoFijo.lon != null) {
    const distNF = haversineMeters(lat, lon, nodoFijo.lat, nodoFijo.lon);
    const etaNF = calcEtaSeconds(distNF, usedSpeedKmh);
    document.getElementById("eta_nf").textContent = formatETA(etaNF);
    document.getElementById("dist_nf").textContent = formatDist(distNF);
  } else {
    document.getElementById("eta_nf").textContent = "--";
    document.getElementById("dist_nf").textContent = "--";
  }

  // Popup activo
  if(activeStopId){
    if (activeStopId === nodoFijo.id && nodoFijoMarker && nodoFijo.lat != null) {
      const dist2 = haversineMeters(lat,lon,nodoFijo.lat,nodoFijo.lon);
      const eta2 = formatETA(calcEtaSeconds(dist2, usedSpeedKmh));
      const distText = formatDist(dist2);

      nodoFijoMarker.setPopupContent(
        `<b>🚏 Nodo Fijo</b>` +
        `<br>Llegada Bus: <b>${eta2}</b>` +
        `<br>Distancia: <b>${distText}</b>` +
        `<br>Velocidad usada: <b>${usedSpeedKmh.toFixed(1)} km/h</b>` +
        `<br><small>(ruta x${ROUTE_FACTOR.toFixed(2)} + ${ETA_BIAS_SEC}s)</small>`
      );
      return;
    }

    const s = stops.find(x=>x.id===activeStopId);
    const m = stopMarkers.get(activeStopId);
    if(!s || !m) return;

    const dist2 = haversineMeters(lat,lon,s.lat,s.lon);
    const eta2 = formatETA(calcEtaSeconds(dist2, usedSpeedKmh));
    const distText = formatDist(dist2);

    m.setPopupContent(
      `<b>🚏 ${s.name}</b>` +
      `<br>LLega: <b>${eta2}</b>` +
      `<br>Distancia: <b>${distText}</b>` +
      `<br>Velocidad Actual: <b>${usedSpeedKmh.toFixed(1)} km/h</b>` +
      `<br><small>(ruta x${ROUTE_FACTOR.toFixed(2)} + ${ETA_BIAS_SEC}s)</small>`
    );
  }
});
</script>
</body>
</html>
